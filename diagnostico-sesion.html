<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Diagnóstico de sesión</title>
<style>
  body { font-family: system-ui, Segoe UI, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem 3rem; color: #12291c; background: #eef1e8; line-height: 1.5; }
  h1 { font-size: 1.5rem; margin-bottom: 0.3rem; }
  p.n { color: #4a5f52; font-size: 0.9rem; margin-top: 0; }
  form { display: grid; gap: 0.6rem; background: #fff; padding: 1rem; border-radius: 12px; border: 1px solid #d9dfd2; margin: 1rem 0; }
  input { padding: 0.65rem 0.8rem; border: 1px solid #b9c3b2; border-radius: 8px; font-size: 1rem; }
  button { padding: 0.7rem 1.1rem; border: 0; border-radius: 999px; background: #8b7349; color: #fff; font-size: 0.95rem; cursor: pointer; }
  button.s { background: #fff; color: #12291c; border: 1px solid #8b7349; }
  .fila { display: flex; gap: 0.6rem; flex-wrap: wrap; margin: 0.8rem 0; }
  pre { background: #0f1f17; color: #d6f5e3; padding: 1rem; border-radius: 12px; white-space: pre-wrap; word-break: break-word; font-size: 0.82rem; min-height: 6rem; }
</style>
</head>
<body>
<h1>Diagnóstico de sesión</h1>
<p class="n">Comprueba si este navegador guarda tu sesión entre páginas. Tu contraseña va solo a Supabase, igual que en el login, y no aparece en el resultado.</p>

<pre id="log">Cargando…</pre>

<form id="f" autocomplete="on">
  <strong>Paso 1 · prueba de acceso</strong>
  <input id="email" type="email" placeholder="Correo" autocomplete="username" required>
  <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password" required>
  <button type="submit">Probar acceso</button>
</form>

<div class="fila">
  <button class="s" id="recargar" type="button">Paso 2 · recargar y comprobar</button>
  <button id="copiar" type="button">Copiar resultado</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/supabase-config.js"></script>
<script>
var lineas = [];
try { lineas = JSON.parse(sessionStorage.getItem('mt_diag_log') || '[]'); if (lineas.length) lineas.push('', '═══ (se recargó la página) ═══'); } catch (e) {}
function p(s) {
  lineas.push(s);
  document.getElementById('log').textContent = lineas.join('\n');
  try { sessionStorage.setItem('mt_diag_log', JSON.stringify(lineas)); } catch (e) {}
}
async function estado(titulo) {
  p('— ' + titulo + ' —');
  p('sitio: ' + location.origin + location.pathname);
  try { localStorage.setItem('mt_t', '1'); p('localStorage guarda datos: ' + (localStorage.getItem('mt_t') === '1')); localStorage.removeItem('mt_t'); } catch (e) { p('localStorage ERROR: ' + e.message); }
  try { sessionStorage.setItem('mt_t', '1'); p('sessionStorage guarda datos: ' + (sessionStorage.getItem('mt_t') === '1')); sessionStorage.removeItem('mt_t'); } catch (e) { p('sessionStorage ERROR: ' + e.message); }
  p('cookies activadas: ' + navigator.cookieEnabled + ' · navigator.locks: ' + !!navigator.locks);
  try {
    var claves = [];
    for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k.indexOf('sb-') === 0) claves.push(k + ' (' + (localStorage.getItem(k) || '').length + ' caracteres)'); }
    p('sesión guardada en el navegador: ' + (claves.length ? claves.join(', ') : 'NINGUNA'));
  } catch (e) { p('no se pudo leer el almacenamiento: ' + e.message); }
  var listo = typeof supabaseConfigurado !== 'undefined' && supabaseConfigurado;
  p('librería de Supabase cargada: ' + !!window.supabase + ' · cliente listo: ' + listo);
  if (!listo) return;
  try {
    var r = await supabaseClient.auth.getSession();
    p('getSession: ' + (r.data && r.data.session ? 'HAY sesión' : 'SIN sesión') + (r.error ? ' · error: ' + r.error.message : ''));
  } catch (e) { p('getSession excepción: ' + e.message); }
}
document.getElementById('f').addEventListener('submit', async function (ev) {
  ev.preventDefault();
  if (!(typeof supabaseConfigurado !== 'undefined' && supabaseConfigurado)) { p('El cliente de Supabase no está listo.'); return; }
  p('');
  p('— Paso 1: iniciando sesión —');
  var r = await supabaseClient.auth.signInWithPassword({ email: document.getElementById('email').value.trim(), password: document.getElementById('clave').value });
  if (r.error) { p('signInWithPassword ERROR: ' + r.error.message); return; }
  p('signInWithPassword: correcto');
  await estado('justo después de entrar');
  try {
    var pr = await supabaseClient.from('profiles').select('role').eq('id', r.data.user.id).maybeSingle();
    p('perfil: ' + (pr.data ? 'rol = ' + pr.data.role : 'SIN FILA') + (pr.error ? ' · error: ' + pr.error.code + ' ' + pr.error.message : ''));
  } catch (e) { p('perfil excepción: ' + e.message); }
  p('');
  p('Ahora pulsa «Paso 2 · recargar y comprobar».');
});
document.getElementById('recargar').addEventListener('click', function () { location.reload(); });
document.getElementById('copiar').addEventListener('click', function () {
  var t = lineas.join('\n');
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { alert('Copiado. Pégalo en el chat.'); }, function () { alert('Selecciona el cuadro negro y copia el texto a mano.'); });
});
estado('al abrir la página');
</script>
</body>
</html>
