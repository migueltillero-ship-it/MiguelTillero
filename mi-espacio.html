<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi-espacio | Miguel Tillero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Syne:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root { --bg-color: #eef0e5; --primary-color: #8c734b; --text-dark: #2c3e35; --text-light: #5a665f; --card-bg: #ffffff; --accent-green: #3b5346; }
        body { background-color: var(--bg-color); color: var(--text-dark); font-family: 'Syne', sans-serif; margin: 0; padding: 0; display:flex; flex-direction:column; min-height:100vh;}
        nav.main-nav { background: var(--card-bg); border-bottom: 1px solid rgba(140, 115, 75, 0.2); padding: 1.2rem 5%; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; position: sticky; top: 0; z-index: 100; }
        .nav-brand { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 600; color: var(--text-dark); text-decoration: none; }
        .nav-links { display: flex; gap: 1.2rem; align-items: center; flex-wrap: wrap; list-style: none; margin: 0; padding: 0; }
        .nav-links a { text-decoration: none; color: var(--text-dark); font-size: 0.85rem; font-weight: 600; font-family: 'Space Mono', monospace; text-transform: uppercase; transition: color 0.3s; }
        .nav-links a:hover { color: var(--primary-color); }
        .btn-nav-action { background: var(--accent-green) !important; color: #fff !important; padding: 0.5rem 1rem; border-radius: 20px; }
        main { flex-grow:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 2rem; text-align:center;}
        h1 { font-family: 'Cormorant Garamond', serif; font-size: 3rem; color: var(--primary-color); text-transform: capitalize; margin-bottom: 0.5rem;}
        p { color: var(--text-light); max-width:600px; line-height: 1.6; }
        .lang-switcher { display: flex; gap: 0.4rem; align-items: center; }
        .ctrl-btn { background: none; border: 1px solid rgba(140,115,75,0.3); padding: 0.3rem 0.6rem; border-radius: 6px; font-family: 'Space Mono', monospace; font-size: 0.7rem; cursor: pointer; }
        .ctrl-btn.active { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }
            .hamburger { display: none; background: none; border: none; font-size: 1.8rem; color: var(--accent-green); cursor: pointer; }
        .nav-container { display: flex; align-items: center; gap: 1.5rem; }
        @media (max-width: 900px) {
            .hamburger { display: block; }
            .nav-container { display: none; flex-direction: column; width: 100%; position: absolute; top: 100%; left: 0; background: var(--card-bg); padding: 1.5rem; box-shadow: 0 10px 15px rgba(0,0,0,0.1); border-top: 1px solid rgba(43, 69, 53, 0.1); }
            .nav-container.active { display: flex; }
            .nav-links { flex-direction: column; width: 100%; }
            .nav-links li { width: 100%; text-align: center; margin-bottom: 0.5rem; }
        }
    /* ══════════════════════════════════════════════════════════════
   REFINAMIENTO — Calidez, detalle y modernidad
══════════════════════════════════════════════════════════════ */
:root{
  --r-xs:  8px;
  --r-sm:  14px;
  --r-md:  18px;
  --r-lg:  26px;
  --r-pill: 999px;
  --shadow-card:       0 4px 20px rgba(20,45,32,0.07), 0 1px 2px rgba(20,45,32,0.05);
  --shadow-card-hover: 0 20px 44px rgba(20,45,32,0.14);
}
.btn, .btn-gold, .btn-nav-action { font-family: 'Syne', sans-serif; font-weight: 600; font-size: 0.92rem; letter-spacing: 0.005em; text-transform: none; border-radius: var(--r-pill); }
@media (max-width: 640px){ .btn, .btn-gold{ font-size: 0.88rem; padding: 0.85rem 1.7rem; } }
.nav-links{ flex-wrap: wrap; row-gap: 0.5rem; }
.nav-links a{ font-size: 0.68rem; letter-spacing: 0.1em; }
.ctrl-btn{ font-size: 0.58rem; letter-spacing: 0.12em; border-radius: var(--r-xs); padding: 0.42rem 0.75rem; }
.eyebrow, .hud-label, .hero-pre, .sec-head .eyebrow{ letter-spacing: 0.16em; font-size: 0.7rem; }
.eyebrow::before{ width: 18px; }
.stat-lbl, .tl-date, .tl-org, .edu-year, .c-label, .footer-tag, .footer-copy, .exam-full, .exam-rows b, .pick-goal, .role-tag, .af-chip, .skill-tag, .form-field label, .pay-label, .pay-bank-sub, .qr-info, .pt-count, .svc-num, .lang-pill .lvl, .studybar-inner a, .portal-go{ letter-spacing: 0.12em; }
.stat-lbl, .c-label, .footer-tag, .edu-year, .form-field label, .footer-copy, .af-chip, .studybar-inner a, .portal-go{ font-size: 0.64rem; }
.c-card, .cert-item, .hud-data-box{ border-radius: var(--r-sm); }
.panel, .portal-card, .svc-card, .crs-card, .exam-card, .pick-card, .edu-card, .about-text, .tl-body, .role-panel, .stats-bar, .text-glass, .card, .video-wrapper, .faq-item { border-radius: var(--r-md); }
.portrait-hud, .portrait-inner, .modal-box{ border-radius: var(--r-lg); }
.lang-pill{ border-radius: var(--r-pill); padding: 0.5rem 1.1rem; }
.lang-pill .code{ border-radius: var(--r-xs); }
.skill-tag, .af-chip{ border-radius: var(--r-pill); }
.g-item, .g-item::before{ border-radius: var(--r-sm); }
.form-field input, .form-field textarea, .form-field select{ border-radius: 8px 8px 0 0; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible, [tabindex]:focus-visible{ border-radius: var(--r-xs); }
.panel, .c-card, .hud-data-box, .edu-card, .cert-item, .about-text, .card { box-shadow: var(--shadow-card); }
.portal-card, .svc-card, .crs-card, .exam-card, .card { box-shadow: var(--shadow-card); transition: transform 0.45s cubic-bezier(.16,1,.3,1), border-color 0.4s, box-shadow 0.4s, background 0.4s; }
.portal-card:hover, .svc-card:hover, .crs-card:hover, .exam-card:hover, .card:hover { box-shadow: var(--shadow-card-hover); transform: translateY(-6px); }
.portrait-hud{ box-shadow: var(--shadow-card-hover); }
.services-grid{ gap: 1.15rem; background: none; border: none; }
.svc-card{ border: 1px solid var(--border); }
.intro-skip {
  position: absolute !important;
  top: 2.5rem !important;
  right: 2.5rem !important;
  z-index: 99999 !important;
  background: rgba(4,16,8,0.75) !important;
  border: 1px solid rgba(201,169,110,0.4) !important;
  color: rgba(240,247,242,0.9) !important;
  font-family: 'Space Mono', monospace !important;
  font-size: 0.65rem !important;
  letter-spacing: 0.3em !important;
  text-transform: uppercase !important;
  padding: 0.6rem 1.5rem !important;
  cursor: pointer !important;
  backdrop-filter: blur(12px) !important;
  -webkit-backdrop-filter: blur(12px) !important;
  transition: all 0.3s ease !important;
  border-radius: 40px !important;
  display: flex !important;
  align-items: center !important;
  gap: 0.6rem !important;
}
.intro-skip:hover {
  border-color: #a5824a !important;
  color: #a5824a !important;
  background: rgba(201,169,110,0.15) !important;
  transform: translateY(-2px);
}
</style>
</head>
<body>
        <nav class="main-nav">
        <a href="index.html" class="nav-brand">Miguel Tillero</a>
        <button class="hamburger" id="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>
        <div class="nav-container" id="nav-container">
            <ul class="nav-links">
                <li><a href="perfil.html" data-i18n="nav.perfil">Perfil</a></li>
                <li><a href="servicios.html" data-i18n="nav.servicios">Servicios</a></li>
                <li><a href="cursos.html" data-i18n="nav.cursos">Cursos</a></li>
                <li><a href="galeria.html" data-i18n="nav.galeria">Galería</a></li>
                <li><a href="testimonios.html" data-i18n="nav.testimonios">Testimonios</a></li>
                <li><a href="ressources.html" data-i18n="nav.ressources">Recursos</a></li>
                <li><a href="contacto.html" data-i18n="nav.contacto">Contacto</a></li>
                <li><a href="inscribete.html" class="btn-nav-action" data-i18n="nav.cotizar">Cotizar / Inscribirse</a></li>
            </ul>
            <div class="lang-switcher">
                <button class="ctrl-btn active" onclick="setLang('es')">ES</button>
                <button class="ctrl-btn" onclick="setLang('fr')">FR</button>
                <button class="ctrl-btn" onclick="setLang('en')">EN</button>
            </div>
        </div>
    </nav>

    <main>
        <h1>Mi-espacio</h1>
        <p>Esta sección está siendo estructurada. Estará disponible muy pronto como parte del nuevo ecosistema.</p>
        <br>
        <a href="index.html" style="color:var(--accent-green); font-weight:bold; text-decoration:none;">
            <i class="fa fa-arrow-left"></i> Volver al inicio
        </a>
    </main>

        <script src="assets/js/i18n.js"></script>
    <script>
        const btnMenu = document.getElementById('mobile-menu-btn');
        const navContainer = document.getElementById('nav-container');
        if(btnMenu && navContainer) {
            btnMenu.addEventListener('click', () => {
                navContainer.classList.toggle('active');
                const icon = btnMenu.querySelector('i');
                if(navContainer.classList.contains('active')){
                    icon.classList.remove('fa-bars'); icon.classList.add('fa-xmark');
                } else {
                    icon.classList.remove('fa-xmark'); icon.classList.add('fa-bars');
                }
            });
        }
            // Auto-cierre del menú en móviles al hacer clic en un enlace
        const navLinksMobile = document.querySelectorAll('.nav-links a');
        navLinksMobile.forEach(link => {
            link.addEventListener('click', () => {
                if(navContainer && navContainer.classList.contains('active')) {
                    navContainer.classList.remove('active');
                    const icon = btnMenu.querySelector('i');
                    if(icon) { icon.classList.remove('fa-xmark'); icon.classList.add('fa-bars'); }
                }
            });
        });
    </script>
</body>
</html>
