  <circle cx="260" cy="140" r="21" fill="#0d3b2e"/>
  <path d="M229 194 a31 31 0 0 1 62 0 Z" fill="#0d3b2e"/>
  <!-- dos recuadros pequeños -->
  <rect x="338" y="98" width="72" height="45" rx="5" fill="#c9a96e"/>
  <circle cx="374" cy="117" r="11" fill="#0d3b2e"/>
  <path d="M358 143 a16 16 0 0 1 32 0 Z" fill="#0d3b2e"/>
  <rect x="338" y="149" width="72" height="45" rx="5" fill="#c9a96e"/>
  <circle cx="374" cy="168" r="11" fill="#0d3b2e"/>
  <path d="M358 194 a16 16 0 0 1 32 0 Z" fill="#0d3b2e"/>
