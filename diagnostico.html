<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnóstico de conexión | Miguel Tillero</title>
<meta name="robots" content="noindex">
<style>
:root { --bg:#eef0e5; --verde:#2b4535; --dorado:#8c734b; --borde:rgba(165,130,74,0.35); }
* { box-sizing:border-box; }
body { background:var(--bg); color:#1a2e24; font-family:system-ui, -apple-system, sans-serif; margin:0; padding:1.5rem; }
.caja { background:#fff; border:1px solid var(--borde); border-radius:16px; padding:1.5rem; max-width:760px; margin:0 auto 1.2rem; }
h1 { font-size:1.4rem; color:var(--verde); margin:0 0 .3rem; }
p.sub { color:#5a665f; font-size:.9rem; margin:0 0 1.2rem; }
label { display:block; font-size:.7rem; text-transform:uppercase; letter-spacing:.1em; color:var(--verde); margin-bottom:.3rem; }
input { width:100%; padding:.8rem; border:1px solid var(--borde); border-radius:8px; font-size:1rem; margin-bottom:.9rem; }
button { background:var(--dorado); color:#fff; border:none; padding:.9rem 1.6rem; border-radius:999px; font-size:1rem; font-weight:600; cursor:pointer; width:100%; }
button:disabled { opacity:.6; cursor:not-allowed; }
#salida { font-family:ui-monospace, Menlo, Consolas, monospace; font-size:.82rem; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
.paso { padding:.7rem .9rem; border-radius:8px; margin-bottom:.5rem; border-left:4px solid #ccc; background:#fafaf7; }
.ok { border-left-color:#2b7a4b; }
.mal { border-left-color:#a13324; background:rgba(180,50,40,.06); }
.info { border-left-color:#8c734b; }
.copiar { background:var(--verde); margin-top:1rem; }
</style>
</head>
<body>
<div class="caja">
  <h1>Diagnóstico de conexión</h1>
  <p class="sub">Esta página prueba paso a paso la conexión con la base de datos y muestra exactamente dónde falla. Es solo para uso interno.</p>
  <label>Correo</label>
  <input type="email" id="email" value="migueltillero@gmail.com">
  <label>Contraseña</label>
  <input type="password" id="password">
  <button id="btn" onclick="ejecutar()">Ejecutar diagnóstico</button>
</div>

<div class="caja" id="caja-salida" style="display:none;">
  <div id="salida"></div>
  <button class="copiar" onclick="copiar()">Copiar informe</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/supabase-config.js?v=1789127831"></script>
<script>
const salida = document.getElementById('salida');
let texto = '';

function paso(titulo, detalle, estado) {
    const div = document.createElement('div');
    div.className = 'paso ' + (estado || 'info');
    div.textContent = titulo + (detalle ? '\n' + detalle : '');
    salida.appendChild(div);
    texto += titulo + (detalle ? '\n  ' + detalle : '') + '\n';
}

function copiar() {
    navigator.clipboard.writeText(texto).then(
        () => alert('Informe copiado. Pégalo en el chat.'),
        () => alert('No se pudo copiar. Toma una captura de pantalla.')
    );
}

async function ejecutar() {
    document.getElementById('btn').disabled = true;
    document.getElementById('caja-salida').style.display = 'block';
    salida.innerHTML = '';
    texto = '';

    // 1. Librería
    paso('1. Librería supabase-js', window.supabase ? 'cargada correctamente' : 'NO se cargó', window.supabase ? 'ok' : 'mal');
    if (!window.supabase) return;

    // 2. Configuración
    paso('2. Configuración', 'URL: ' + SUPABASE_URL + '\n  Clave: ' + SUPABASE_ANON_KEY.slice(0, 22) + '…' +
         '\n  Tipo de clave: ' + (SUPABASE_ANON_KEY.startsWith('sb_publishable') ? 'nueva (publishable)' : 'antigua (JWT anon)'), 'info');

    // 3. localStorage
    let lsOk = false;
    try { localStorage.setItem('__p', '1'); lsOk = localStorage.getItem('__p') === '1'; localStorage.removeItem('__p'); } catch (e) {}
    paso('3. Almacenamiento del navegador', lsOk ? 'funciona' : 'BLOQUEADO (la sesión no se podrá guardar)', lsOk ? 'ok' : 'mal');

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    // 4. Inicio de sesión
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
        paso('4. Inicio de sesión', 'FALLÓ: ' + error.message, 'mal');
        document.getElementById('btn').disabled = false;
        return;
    }
    paso('4. Inicio de sesión', 'OK\n  user.id: ' + (data.user && data.user.id) +
         '\n  ¿trae sesión?: ' + (data.session ? 'sí' : 'NO') +
         '\n  ¿trae access_token?: ' + (data.session && data.session.access_token ? 'sí (' + data.session.access_token.length + ' caracteres)' : 'NO'),
         data.session ? 'ok' : 'mal');

    // 5. ¿El cliente recuerda la sesión?
    const s1 = await supabaseClient.auth.getSession();
    paso('5. getSession() justo después', s1.data && s1.data.session ? 'OK, hay sesión' : 'NO devolvió sesión', (s1.data && s1.data.session) ? 'ok' : 'mal');

    // 6. setSession explícito
    if (data.session) {
        try {
            const r = await supabaseClient.auth.setSession({ access_token: data.session.access_token, refresh_token: data.session.refresh_token });
            paso('6. setSession() explícito', r.error ? 'error: ' + r.error.message : 'OK', r.error ? 'mal' : 'ok');
        } catch (e) { paso('6. setSession() explícito', 'excepción: ' + e.message, 'mal'); }
        const s2 = await supabaseClient.auth.getSession();
        paso('6b. getSession() tras setSession', s2.data && s2.data.session ? 'OK, hay sesión' : 'sigue sin sesión', (s2.data && s2.data.session) ? 'ok' : 'mal');
    }

    // 7. Consulta del perfil con el cliente normal
    const q1 = await supabaseClient.from('profiles').select('*').eq('id', data.user.id);
    paso('7. Leer mi perfil (cliente normal)',
         q1.error ? 'ERROR ' + (q1.error.code || '') + ': ' + q1.error.message : 'filas devueltas: ' + (q1.data ? q1.data.length : 0) +
         (q1.data && q1.data.length ? '\n  rol: ' + q1.data[0].role + ' / nombre: ' + q1.data[0].nombre_completo : ''),
         (!q1.error && q1.data && q1.data.length) ? 'ok' : 'mal');

    // 8. Consulta con el token puesto a mano
    if (data.session) {
        const c2 = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            global: { headers: { Authorization: 'Bearer ' + data.session.access_token } }
        });
        const q2 = await c2.from('profiles').select('*').eq('id', data.user.id);
        paso('8. Leer mi perfil (token puesto a mano)',
             q2.error ? 'ERROR ' + (q2.error.code || '') + ': ' + q2.error.message : 'filas devueltas: ' + (q2.data ? q2.data.length : 0) +
             (q2.data && q2.data.length ? '\n  rol: ' + q2.data[0].role : ''),
             (!q2.error && q2.data && q2.data.length) ? 'ok' : 'mal');
    }

    // 9. ¿Cuántos perfiles ve en total? (para saber si RLS responde)
    const q3 = await supabaseClient.from('profiles').select('id', { count: 'exact', head: true });
    paso('9. Perfiles visibles en total', q3.error ? 'ERROR: ' + q3.error.message : String(q3.count), 'info');

    // 10. Cursos abiertos (prueba de lectura pública)
    const q4 = await supabaseClient.from('cursos').select('id, nombre, estado');
    paso('10. Cursos visibles', q4.error ? 'ERROR ' + (q4.error.code || '') + ': ' + q4.error.message : 'filas: ' + (q4.data ? q4.data.length : 0), q4.error ? 'mal' : 'ok');

    paso('— FIN DEL DIAGNÓSTICO —', 'Copia este informe y mándalo al chat.', 'info');
    document.getElementById('btn').disabled = false;
}
</script>
</body>
</html>
