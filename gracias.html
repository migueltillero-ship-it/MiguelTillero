<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gracias | Miguel Tillero</title>
<meta name="description" content="Tu formulario fue enviado. Miguel Tillero te contactará pronto.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Syne:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root { --bg-color: #eef0e5; --primary-color: #8c734b; --primary-hover: #6f552f; --text-dark: #1a2e24; --text-light: #5a665f; --card-bg: rgba(255,255,255,0.85); --accent-green: #2b4535; --border: rgba(165,130,74,0.38);
--r-md: 18px; --r-pill: 999px; --shadow-card: 0 4px 20px rgba(20,45,32,0.07), 0 1px 2px rgba(20,45,32,0.05); }
body { background-color: var(--bg-color); color: var(--text-dark); font-family: 'Syne', sans-serif; margin: 0; padding: 0; display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center; }
.card { background: var(--card-bg); padding: 3rem 2.5rem; border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-card); max-width: 480px; margin: 1.5rem; }
.icon { font-size: 2.4rem; color: var(--primary-color); margin-bottom: 1rem; }
h1 { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 2.4rem; color: var(--accent-green); margin: 0 0 1rem; }
p { color: var(--text-light); line-height: 1.7; font-size: 0.95rem; }
.btn-gold { display: inline-flex; align-items:center; gap:0.5rem; background: var(--primary-color); color: #ffffff; padding: 0.9rem 2rem; font-family: 'Syne', sans-serif; font-size: 0.9rem; text-decoration: none; border-radius: var(--r-pill); font-weight: 600; margin-top: 1.2rem; }
.btn-gold:hover { background: var(--primary-hover); }
</style>
</head>
<body>
<div class="card">
    <div class="icon"><i class="fa-solid fa-circle-check"></i></div>
    <h1>¡Recibido!</h1>
    <p>Gracias por escribirme. Revisé tu mensaje y te contactaré por WhatsApp o correo electrónico en cuanto pueda para confirmar los siguientes pasos.</p>
    <a href="index.html" class="btn-gold"><i class="fa-solid fa-arrow-left"></i> Volver al sitio</a>
</div>
</body>
</html>
