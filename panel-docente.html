<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel docente | Miguel Tillero</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Syne:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root { --bg-color: #eef0e5; --primary-color: #8c734b; --primary-hover: #6f552f; --text-dark: #1a2e24; --text-light: #5a665f; --card-bg: #ffffff; --accent-green: #2b4535; --border: rgba(165,130,74,0.3); --danger:#a13324;
--r-xs: 8px; --r-sm: 14px; --r-md: 18px; --r-pill: 999px; --shadow-card: 0 4px 20px rgba(20,45,32,0.07), 0 1px 2px rgba(20,45,32,0.05);}
* { box-sizing: border-box; }
body { background-color: var(--bg-color); color: var(--text-dark); font-family: 'Syne', sans-serif; margin: 0; padding: 0; }
nav.main-nav { background: #ffffff; border-bottom: 1px solid rgba(43, 69, 53, 0.2); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; flex-wrap:wrap; gap:0.8rem; }
.nav-brand { font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; font-weight: 600; color: var(--accent-green); text-decoration: none; }
.nav-right { display:flex; align-items:center; gap:1rem; font-family:'Space Mono',monospace; font-size:0.72rem; }
.nav-right a, .nav-right button { color: var(--primary-color); text-decoration:none; background:none; border:none; cursor:pointer; font-family:'Space Mono',monospace; font-size:0.72rem; }
main { padding: 2rem 5% 4rem; max-width: 1100px; margin: 0 auto; }
h1 { font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; color: var(--accent-green); margin: 0 0 0.3rem;}
.muted { color: var(--text-light); font-size:0.9rem; margin: 0 0 1.6rem; }
.panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-card); padding: 1.6rem; margin-bottom: 1.6rem; }
.panel h2 { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; color: var(--accent-green); margin: 0 0 1rem; }
.cursos-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap: 1rem; }
.curso-card { border: 1px solid var(--border); border-radius: var(--r-sm); padding: 1.1rem; cursor:pointer; transition: box-shadow 0.2s, border-color 0.2s; }
.curso-card:hover, .curso-card.activo { border-color: var(--primary-color); box-shadow: var(--shadow-card); }
.curso-card h3 { font-family:'Cormorant Garamond',serif; font-size:1.25rem; margin:0 0 0.3rem; color:var(--text-dark);}
.curso-card .estado { display:inline-block; font-family:'Space Mono',monospace; font-size:0.6rem; text-transform:uppercase; letter-spacing:0.08em; padding:0.2rem 0.6rem; border-radius:var(--r-pill); background:rgba(43,69,53,0.1); color:var(--accent-green); margin-top:0.5rem;}
.btn { background: var(--primary-color); color:#fff; border:none; padding:0.7rem 1.3rem; border-radius:var(--r-pill); font-family:'Syne',sans-serif; font-weight:600; font-size:0.85rem; cursor:pointer; }
.btn:hover { background: var(--primary-hover); }
.btn.secundario { background:transparent; color:var(--accent-green); border:1px solid var(--border); }
.btn.pequeno { padding:0.4rem 0.9rem; font-size:0.75rem; }
.btn.peligro { background: var(--danger); }
.form-field { margin-bottom: 0.9rem; }
.form-field label { display:block; font-family:'Space Mono',monospace; font-size:0.6rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--accent-green); margin-bottom:0.35rem; }
.form-field input, .form-field select, .form-field textarea { width:100%; padding:0.7rem; border:1px solid var(--border); border-radius:8px; font-family:'Syne',sans-serif; font-size:0.9rem; }
.form-grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(160px,1fr)); gap:0.9rem; }
table { width:100%; border-collapse: collapse; font-size:0.85rem; }
th, td { text-align:left; padding:0.6rem 0.5rem; border-bottom:1px solid var(--border); }
th { font-family:'Space Mono',monospace; font-size:0.62rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-light); }
.tabs { display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1.4rem; }
.tab-btn { background:none; border:1px solid var(--border); padding:0.55rem 1.1rem; border-radius:var(--r-pill); font-family:'Space Mono',monospace; font-size:0.65rem; letter-spacing:0.06em; text-transform:uppercase; cursor:pointer; color:var(--text-dark); }
.tab-btn.activo { background:var(--accent-green); color:#fff; border-color:var(--accent-green); }
.tab-content { display:none; }
.tab-content.activo { display:block; }
.badge { font-family:'Space Mono',monospace; font-size:0.6rem; text-transform:uppercase; padding:0.2rem 0.55rem; border-radius:var(--r-pill); }
.badge.pendiente { background:rgba(140,115,75,0.15); color:var(--primary-color); }
.badge.activa { background:rgba(43,69,53,0.12); color:var(--accent-green); }
.badge.rechazada { background:rgba(161,51,36,0.1); color:var(--danger); }
.badge.finalizada { background:rgba(90,102,95,0.15); color:var(--text-light); }
.msg { margin-top: 0.8rem; padding: 0.7rem 0.9rem; border-radius: var(--r-xs); font-size: 0.82rem; display:none; }
.msg.error { background: rgba(180,50,40,0.1); color: var(--danger); border: 1px solid rgba(180,50,40,0.25); }
.msg.ok { background: rgba(43,69,53,0.1); color: var(--accent-green); border: 1px solid rgba(43,69,53,0.25); }
.acciones-fila { display:flex; gap:0.4rem; flex-wrap:wrap; }
#modal-ficha { display:none; position:fixed; inset:0; background:rgba(20,30,25,0.55); align-items:center; justify-content:center; z-index:999; padding:1rem; }
#modal-ficha .ficha-box { background:#fff; border-radius:var(--r-md); padding:2rem; max-width:480px; width:100%; }
#modal-ficha h2 { font-family:'Cormorant Garamond',serif; color:var(--accent-green); }
#modal-ficha dl { display:grid; grid-template-columns: 130px 1fr; gap:0.5rem 1rem; font-size:0.88rem; }
#modal-ficha dt { color:var(--text-light); font-family:'Space Mono',monospace; font-size:0.68rem; text-transform:uppercase; }
.cerrar-modal { float:right; background:none; border:none; font-size:1.3rem; cursor:pointer; color:var(--text-light); }
@media print {
  nav, main > *:not(#modal-ficha), .cerrar-modal, #modal-ficha .btn { display:none !important; }
  #modal-ficha { display:flex !important; position:static; background:none; }
  #modal-ficha .ficha-box { box-shadow:none; }
}
</style>
</head>
<body>
<nav class="main-nav">
    <a href="index.html" class="nav-brand">Miguel Tillero · Panel docente</a>
    <div class="nav-right">
        <span id="nombre-docente"></span>
        <button onclick="cerrarSesion()"><i class="fa-solid fa-right-from-bracket"></i> Salir</button>
    </div>
</nav>

<main>
    <div id="aviso-config" class="msg error" style="display:none; margin-bottom:1.5rem;"></div>
    <div id="contenido-panel" style="display:none;">

        <!-- MIS CURSOS -->
        <section class="panel">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
                <div>
                    <h2>Mis cursos</h2>
                    <p class="muted" style="margin:0;">Selecciona un curso para gestionar su planificación, asistencia, estudiantes y notas.</p>
                </div>
                <button class="btn" onclick="mostrarFormNuevoCurso()"><i class="fa-solid fa-plus"></i> Nuevo curso</button>
            </div>

            <div id="form-nuevo-curso" style="display:none; margin-top:1.4rem; border-top:1px solid var(--border); padding-top:1.4rem;">
                <div class="form-grid">
                    <div class="form-field"><label>Nombre *</label><input id="nc-nombre" placeholder="Ej. Francés B2 — Grupo A"></div>
                    <div class="form-field"><label>Nivel</label><input id="nc-nivel" placeholder="Ej. B2"></div>
                    <div class="form-field"><label>Cupo máximo</label><input id="nc-cupo" type="number" min="1"></div>
                    <div class="form-field"><label>Fecha inicio</label><input id="nc-inicio" type="date"></div>
                    <div class="form-field"><label>Fecha cierre</label><input id="nc-fin" type="date"></div>
                    <div class="form-field"><label>Estado</label>
                        <select id="nc-estado">
                            <option value="borrador">Borrador (no visible)</option>
                            <option value="abierto">Abierto (visible en inscripción)</option>
                        </select>
                    </div>
                </div>
                <div class="form-field"><label>Descripción</label><textarea id="nc-desc" rows="2"></textarea></div>
                <button class="btn" onclick="crearCurso()"><i class="fa-solid fa-check"></i> Crear curso</button>
                <button class="btn secundario" onclick="document.getElementById('form-nuevo-curso').style.display='none'">Cancelar</button>
                <div id="msg-nuevo-curso" class="msg"></div>
            </div>

            <div class="cursos-grid" id="lista-cursos" style="margin-top:1.4rem;"></div>
        </section>

        <!-- DETALLE DE CURSO -->
        <section id="detalle-curso" class="panel" style="display:none;">
            <h2 id="titulo-curso-detalle"></h2>
            <div class="tabs">
                <button class="tab-btn activo" data-tab="planificacion" onclick="cambiarTab('planificacion')">Planificación</button>
                <button class="tab-btn" data-tab="asistencia" onclick="cambiarTab('asistencia')">Asistencia</button>
                <button class="tab-btn" data-tab="estudiantes" onclick="cambiarTab('estudiantes')">Estudiantes</button>
                <button class="tab-btn" data-tab="notas" onclick="cambiarTab('notas')">Notas</button>
            </div>

            <!-- PLANIFICACIÓN -->
            <div class="tab-content activo" id="tab-planificacion">
                <div class="form-grid" style="align-items:end;">
                    <div class="form-field"><label>Fecha *</label><input id="sesion-fecha" type="date"></div>
                    <div class="form-field"><label>Tema</label><input id="sesion-tema" placeholder="Ej. Condicional presente"></div>
                </div>
                <div class="form-field"><label>Contenido / notas de la sesión</label><textarea id="sesion-contenido" rows="2"></textarea></div>
                <button class="btn pequeno" onclick="crearSesion()"><i class="fa-solid fa-plus"></i> Añadir sesión</button>
                <div id="msg-sesion" class="msg"></div>
                <table style="margin-top:1.2rem;">
                    <thead><tr><th>Fecha</th><th>Tema</th><th>Contenido</th></tr></thead>
                    <tbody id="tabla-sesiones"></tbody>
                </table>
            </div>

            <!-- ASISTENCIA -->
            <div class="tab-content" id="tab-asistencia">
                <div class="form-field" style="max-width:320px;">
                    <label>Sesión</label>
                    <select id="asistencia-sesion" onchange="cargarAsistencia()"></select>
                </div>
                <table>
                    <thead><tr><th>Estudiante</th><th>Presente</th><th>Observación</th></tr></thead>
                    <tbody id="tabla-asistencia"></tbody>
                </table>
                <button class="btn pequeno" onclick="guardarAsistencia()" id="btn-guardar-asistencia" style="display:none; margin-top:1rem;">
                    <i class="fa-solid fa-floppy-disk"></i> Guardar asistencia
                </button>
                <div id="msg-asistencia" class="msg"></div>
            </div>

            <!-- ESTUDIANTES -->
            <div class="tab-content" id="tab-estudiantes">
                <table>
                    <thead><tr><th>Nombre</th><th>Teléfono</th><th>Estado</th><th>Acciones</th></tr></thead>
                    <tbody id="tabla-estudiantes"></tbody>
                </table>
                <div id="msg-estudiantes" class="msg"></div>
            </div>

            <!-- NOTAS -->
            <div class="tab-content" id="tab-notas">
                <div class="form-grid" style="align-items:end;">
                    <div class="form-field"><label>Nombre de la evaluación *</label><input id="ev-nombre" placeholder="Ej. Examen módulo 3"></div>
                    <div class="form-field"><label>Fecha</label><input id="ev-fecha" type="date"></div>
                    <div class="form-field"><label>Ponderación (%)</label><input id="ev-pond" type="number" min="0" max="100"></div>
                </div>
                <button class="btn pequeno" onclick="crearEvaluacion()"><i class="fa-solid fa-plus"></i> Añadir evaluación</button>
                <div id="msg-evaluacion" class="msg"></div>

                <div class="form-field" style="max-width:320px; margin-top:1.4rem;">
                    <label>Evaluación</label>
                    <select id="notas-evaluacion" onchange="cargarNotas()"></select>
                </div>
                <table>
                    <thead><tr><th>Estudiante</th><th>Calificación</th><th>Comentario</th></tr></thead>
                    <tbody id="tabla-notas"></tbody>
                </table>
                <button class="btn pequeno" onclick="guardarNotas()" id="btn-guardar-notas" style="display:none; margin-top:1rem;">
                    <i class="fa-solid fa-floppy-disk"></i> Guardar notas
                </button>
                <div id="msg-notas" class="msg"></div>
            </div>
        </section>
    </div>
</main>

<!-- MODAL FICHA IMPRIMIBLE -->
<div id="modal-ficha">
    <div class="ficha-box">
        <button class="cerrar-modal" onclick="document.getElementById('modal-ficha').style.display='none'">&times;</button>
        <h2>Ficha de inscripción</h2>
        <dl id="ficha-contenido"></dl>
        <br>
        <button class="btn" onclick="window.print()"><i class="fa-solid fa-print"></i> Imprimir / Guardar PDF</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/supabase-config.js?v=1789127831"></script>
<script src="assets/js/auth-helpers.js?v=1789127831"></script>
<script>
let perfilDocente = null;
let cursos = [];
let cursoActualId = null;
let sesionesActuales = [];
let estudiantesActivosActuales = []; // [{id, nombre_completo, telefono}]

function mostrarMsg(el, texto, tipo) {
    el.textContent = texto;
    el.className = 'msg ' + tipo;
    el.style.display = 'block';
}

function esc(s) {
    return (s || '').toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function iniciar() {
    if (!supabaseConfigurado) {
        mostrarAvisoSinConfigurar('aviso-config');
        return;
    }
    const contexto = await requerirSesion('docente');
    if (!contexto) return;
    perfilDocente = contexto.perfil;
    document.getElementById('nombre-docente').textContent = perfilDocente.nombre_completo;
    document.getElementById('contenido-panel').style.display = 'block';
    await cargarCursos();
}

async function cargarCursos() {
    const { data, error } = await supabaseClient
        .from('cursos')
        .select('*')
        .eq('docente_id', perfilDocente.id)
        .order('created_at', { ascending: false });
    cursos = data || [];
    const cont = document.getElementById('lista-cursos');
    if (cursos.length === 0) {
        cont.innerHTML = '<p class="muted">Todavía no tienes cursos. Crea el primero arriba.</p>';
        return;
    }
    cont.innerHTML = cursos.map(c => `
        <div class="curso-card ${c.id === cursoActualId ? 'activo' : ''}" onclick="seleccionarCurso('${c.id}')">
            <h3>${esc(c.nombre)}</h3>
            <div class="muted" style="margin:0;">${esc(c.nivel || '')}</div>
            <div class="muted" style="margin:0.3rem 0 0; font-size:0.78rem;">${c.fecha_inicio || '—'} → ${c.fecha_fin || '—'}</div>
            <span class="estado">${c.estado}</span>
        </div>
    `).join('');
}

function mostrarFormNuevoCurso() {
    document.getElementById('form-nuevo-curso').style.display = 'block';
}

async function crearCurso() {
    const msgEl = document.getElementById('msg-nuevo-curso');
    const nombre = document.getElementById('nc-nombre').value.trim();
    if (!nombre) { mostrarMsg(msgEl, 'El nombre del curso es obligatorio.', 'error'); return; }

    const { error } = await supabaseClient.from('cursos').insert({
        docente_id: perfilDocente.id,
        nombre,
        nivel: document.getElementById('nc-nivel').value.trim() || null,
        cupo_maximo: document.getElementById('nc-cupo').value || null,
        fecha_inicio: document.getElementById('nc-inicio').value || null,
        fecha_fin: document.getElementById('nc-fin').value || null,
        estado: document.getElementById('nc-estado').value,
        descripcion: document.getElementById('nc-desc').value.trim() || null
    });

    if (error) { mostrarMsg(msgEl, error.message, 'error'); return; }
    document.getElementById('form-nuevo-curso').style.display = 'none';
    ['nc-nombre','nc-nivel','nc-cupo','nc-inicio','nc-fin','nc-desc'].forEach(id => document.getElementById(id).value = '');
    await cargarCursos();
}

async function seleccionarCurso(id) {
    cursoActualId = id;
    const curso = cursos.find(c => c.id === id);
    document.getElementById('titulo-curso-detalle').textContent = curso.nombre;
    document.getElementById('detalle-curso').style.display = 'block';
    await cargarCursos(); // refresca resaltado
    cambiarTab('planificacion');
    await Promise.all([cargarSesiones(), cargarEstudiantes(), cargarEvaluaciones()]);
    document.getElementById('detalle-curso').scrollIntoView({ behavior: 'smooth' });
}

function cambiarTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('activo', b.dataset.tab === tab));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('activo', c.id === 'tab-' + tab));
}

// ---- PLANIFICACIÓN / SESIONES ----
async function cargarSesiones() {
    const { data } = await supabaseClient.from('sesiones').select('*').eq('curso_id', cursoActualId).order('fecha');
    sesionesActuales = data || [];
    document.getElementById('tabla-sesiones').innerHTML = sesionesActuales.map(s => `
        <tr><td>${s.fecha}</td><td>${esc(s.tema)}</td><td>${esc(s.contenido)}</td></tr>
    `).join('') || '<tr><td colspan="3" class="muted">Sin sesiones todavía.</td></tr>';

    const sel = document.getElementById('asistencia-sesion');
    sel.innerHTML = '<option value="">Selecciona una sesión</option>' +
        sesionesActuales.map(s => `<option value="${s.id}">${s.fecha} — ${esc(s.tema || 'Sin tema')}</option>`).join('');

    const selEv = document.getElementById('ev-fecha');
}

async function crearSesion() {
    const msgEl = document.getElementById('msg-sesion');
    const fecha = document.getElementById('sesion-fecha').value;
    if (!fecha) { mostrarMsg(msgEl, 'La fecha es obligatoria.', 'error'); return; }
    const { error } = await supabaseClient.from('sesiones').insert({
        curso_id: cursoActualId,
        fecha,
        tema: document.getElementById('sesion-tema').value.trim() || null,
        contenido: document.getElementById('sesion-contenido').value.trim() || null
    });
    if (error) { mostrarMsg(msgEl, error.message, 'error'); return; }
    document.getElementById('sesion-fecha').value = '';
    document.getElementById('sesion-tema').value = '';
    document.getElementById('sesion-contenido').value = '';
    await cargarSesiones();
}

// ---- ASISTENCIA ----
async function cargarAsistencia() {
    const sesionId = document.getElementById('asistencia-sesion').value;
    const tbody = document.getElementById('tabla-asistencia');
    const btn = document.getElementById('btn-guardar-asistencia');
    if (!sesionId) { tbody.innerHTML = ''; btn.style.display = 'none'; return; }

    const { data: existente } = await supabaseClient.from('asistencia').select('*').eq('sesion_id', sesionId);
    const mapa = {};
    (existente || []).forEach(a => mapa[a.estudiante_id] = a);

    tbody.innerHTML = estudiantesActivosActuales.map(est => {
        const a = mapa[est.id];
        return `<tr data-estudiante="${est.id}">
            <td>${esc(est.nombre_completo)}</td>
            <td><input type="checkbox" class="chk-presente" ${a && a.presente ? 'checked' : ''}></td>
            <td><input type="text" class="txt-observacion" value="${esc(a ? a.observacion : '')}" style="width:100%; padding:0.4rem; border:1px solid var(--border); border-radius:6px;"></td>
        </tr>`;
    }).join('') || '<tr><td colspan="3" class="muted">No hay estudiantes activos en este curso.</td></tr>';

    btn.style.display = estudiantesActivosActuales.length ? 'inline-block' : 'none';
}

async function guardarAsistencia() {
    const sesionId = document.getElementById('asistencia-sesion').value;
    const msgEl = document.getElementById('msg-asistencia');
    const filas = document.querySelectorAll('#tabla-asistencia tr[data-estudiante]');
    const registros = Array.from(filas).map(tr => ({
        sesion_id: sesionId,
        estudiante_id: tr.dataset.estudiante,
        presente: tr.querySelector('.chk-presente').checked,
        observacion: tr.querySelector('.txt-observacion').value.trim() || null
    }));
    const { error } = await supabaseClient.from('asistencia').upsert(registros, { onConflict: 'sesion_id,estudiante_id' });
    if (error) { mostrarMsg(msgEl, error.message, 'error'); return; }
    mostrarMsg(msgEl, 'Asistencia guardada.', 'ok');
}

// ---- ESTUDIANTES / INSCRIPCIONES ----
async function cargarEstudiantes() {
    const { data: inscripciones } = await supabaseClient
        .from('inscripciones')
        .select('*')
        .eq('curso_id', cursoActualId);

    const ids = (inscripciones || []).map(i => i.estudiante_id);
    let perfiles = [];
    if (ids.length) {
        const { data } = await supabaseClient.from('profiles').select('id, nombre_completo, telefono').in('id', ids);
        perfiles = data || [];
    }
    const perfilPorId = {};
    perfiles.forEach(p => perfilPorId[p.id] = p);

    estudiantesActivosActuales = (inscripciones || [])
        .filter(i => i.estado === 'activa')
        .map(i => perfilPorId[i.estudiante_id])
        .filter(Boolean);

    document.getElementById('tabla-estudiantes').innerHTML = (inscripciones || []).map(i => {
        const p = perfilPorId[i.estudiante_id] || { nombre_completo: '(perfil no encontrado)', telefono: '' };
        return `<tr>
            <td>${esc(p.nombre_completo)}</td>
            <td>${esc(p.telefono)}</td>
            <td><span class="badge ${i.estado}">${i.estado}</span></td>
            <td class="acciones-fila">
                ${i.estado === 'pendiente' ? `<button class="btn pequeno" onclick="cambiarEstadoInscripcion('${i.id}','activa')">Aprobar</button>
                <button class="btn pequeno peligro" onclick="cambiarEstadoInscripcion('${i.id}','rechazada')">Rechazar</button>` : ''}
                ${i.estado === 'activa' ? `<button class="btn pequeno secundario" onclick="cambiarEstadoInscripcion('${i.id}','finalizada')">Finalizar</button>` : ''}
                <button class="btn pequeno secundario" onclick='verFicha(${JSON.stringify(p.nombre_completo)}, ${JSON.stringify(p.telefono || "")}, ${JSON.stringify(i.estado)}, ${JSON.stringify(i.created_at)})'>Ver ficha</button>
            </td>
        </tr>`;
    }).join('') || '<tr><td colspan="4" class="muted">Nadie se ha inscrito todavía.</td></tr>';
}

async function cambiarEstadoInscripcion(inscripcionId, nuevoEstado) {
    const msgEl = document.getElementById('msg-estudiantes');
    const { error } = await supabaseClient.from('inscripciones').update({ estado: nuevoEstado }).eq('id', inscripcionId);
    if (error) { mostrarMsg(msgEl, error.message, 'error'); return; }
    await cargarEstudiantes();
}

function verFicha(nombre, telefono, estado, fechaInscripcion) {
    const curso = cursos.find(c => c.id === cursoActualId);
    document.getElementById('ficha-contenido').innerHTML = `
        <dt>Estudiante</dt><dd>${esc(nombre)}</dd>
        <dt>Teléfono</dt><dd>${esc(telefono) || '—'}</dd>
        <dt>Curso</dt><dd>${esc(curso.nombre)}</dd>
        <dt>Nivel</dt><dd>${esc(curso.nivel) || '—'}</dd>
        <dt>Fechas del curso</dt><dd>${curso.fecha_inicio || '—'} → ${curso.fecha_fin || '—'}</dd>
        <dt>Estado inscripción</dt><dd>${esc(estado)}</dd>
        <dt>Fecha de inscripción</dt><dd>${fechaInscripcion ? new Date(fechaInscripcion).toLocaleDateString() : '—'}</dd>
    `;
    document.getElementById('modal-ficha').style.display = 'flex';
}

// ---- NOTAS / EVALUACIONES ----
async function cargarEvaluaciones() {
    const { data } = await supabaseClient.from('evaluaciones').select('*').eq('curso_id', cursoActualId).order('fecha');
    const sel = document.getElementById('notas-evaluacion');
    sel.innerHTML = '<option value="">Selecciona una evaluación</option>' +
        (data || []).map(e => `<option value="${e.id}">${esc(e.nombre)}${e.fecha ? ' — ' + e.fecha : ''}</option>`).join('');
}

async function crearEvaluacion() {
    const msgEl = document.getElementById('msg-evaluacion');
    const nombre = document.getElementById('ev-nombre').value.trim();
    if (!nombre) { mostrarMsg(msgEl, 'El nombre de la evaluación es obligatorio.', 'error'); return; }
    const { error } = await supabaseClient.from('evaluaciones').insert({
        curso_id: cursoActualId,
        nombre,
        fecha: document.getElementById('ev-fecha').value || null,
        ponderacion: document.getElementById('ev-pond').value || null
    });
    if (error) { mostrarMsg(msgEl, error.message, 'error'); return; }
    document.getElementById('ev-nombre').value = '';
    document.getElementById('ev-fecha').value = '';
    document.getElementById('ev-pond').value = '';
    await cargarEvaluaciones();
}

async function cargarNotas() {
    const evaluacionId = document.getElementById('notas-evaluacion').value;
    const tbody = document.getElementById('tabla-notas');
    const btn = document.getElementById('btn-guardar-notas');
    if (!evaluacionId) { tbody.innerHTML = ''; btn.style.display = 'none'; return; }

    const { data: existente } = await supabaseClient.from('notas').select('*').eq('evaluacion_id', evaluacionId);
    const mapa = {};
    (existente || []).forEach(n => mapa[n.estudiante_id] = n);

    tbody.innerHTML = estudiantesActivosActuales.map(est => {
        const n = mapa[est.id];
        return `<tr data-estudiante="${est.id}">
            <td>${esc(est.nombre_completo)}</td>
            <td><input type="number" step="0.1" class="txt-calificacion" value="${n && n.calificacion !== null ? n.calificacion : ''}" style="width:90px; padding:0.4rem; border:1px solid var(--border); border-radius:6px;"></td>
            <td><input type="text" class="txt-comentario" value="${esc(n ? n.comentario : '')}" style="width:100%; padding:0.4rem; border:1px solid var(--border); border-radius:6px;"></td>
        </tr>`;
    }).join('') || '<tr><td colspan="3" class="muted">No hay estudiantes activos en este curso.</td></tr>';

    btn.style.display = estudiantesActivosActuales.length ? 'inline-block' : 'none';
}

async function guardarNotas() {
    const evaluacionId = document.getElementById('notas-evaluacion').value;
    const msgEl = document.getElementById('msg-notas');
    const filas = document.querySelectorAll('#tabla-notas tr[data-estudiante]');
    const registros = Array.from(filas).map(tr => ({
        evaluacion_id: evaluacionId,
        estudiante_id: tr.dataset.estudiante,
        calificacion: tr.querySelector('.txt-calificacion').value || null,
        comentario: tr.querySelector('.txt-comentario').value.trim() || null
    }));
    const { error } = await supabaseClient.from('notas').upsert(registros, { onConflict: 'evaluacion_id,estudiante_id' });
    if (error) { mostrarMsg(msgEl, error.message, 'error'); return; }
    mostrarMsg(msgEl, 'Notas guardadas.', 'ok');
}

iniciar();
</script>
