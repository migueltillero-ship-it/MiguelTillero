<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Atelier d’excellence · L’oral du DELF B2 · Vive el francés</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Space+Mono&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
   ATELIER D'EXCELLENCE · L'ORAL DU DELF B2
   De l'anecdote à l'argument: problematizar, estructurar y matizar. Misma identidad
   que el resto del sitio (malaquita y oro). Las ideas del taller están reescritas con
   ejemplos propios; no se reproduce ninguna marca ni imagen de terceros.
   Teclas: → / espacio / clic = avanzar · ← = retroceder · F = pantalla completa
   · N = notas · S = sonido · B = saltar/incluir el bonus · ? = ayuda
   =========================================================================== */
:root{
  --noche:#12332b; --bosque:#1f6b55; --menta:#eef5f0; --menta2:#d5e5db; --crema:#f3eee2;
  --oro:#a5824a; --oro2:#7a5e2e; --oro-claro:#d9bd86; --tinta:#12332b; --suave:#44645a;
  /* una familia de sonidos = un color, en todas las diapositivas */
  --nas:#3b82c4; --sif:#1f9d73; --vib:#d99a12; --chu:#cf5b7d;
  --display:'Cormorant Garamond',Georgia,serif; --sans:'Syne',Arial,sans-serif; --mono:'Space Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#06130f;overflow:hidden;font-family:var(--sans)}
#viewport{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%);transform-origin:center center;overflow:hidden;background:#12332b}

/* ── Diapositivas y transiciones ───────────────────────────────────────── */
.slide{position:absolute;inset:0;visibility:hidden;opacity:0;z-index:1;overflow:hidden;
  transition:opacity .9s ease,transform .95s cubic-bezier(.2,.7,.2,1),filter .9s ease,clip-path 1.05s cubic-bezier(.7,0,.2,1)}
.slide.active{visibility:visible;opacity:1;z-index:3;transform:none;filter:none;clip-path:none}
.slide.leaving{visibility:visible;opacity:1;z-index:2;transform:none;filter:none;clip-path:none;transition:none}
.slide:not(.active):not(.leaving){transition:none}
.slide[data-trans=zoom]{transform:scale(1.16);filter:blur(22px)}
.slide[data-trans=slide]{transform:translateX(14%)}
.slide[data-trans=rise]{transform:translateY(9%)}
.slide[data-trans=flip]{transform:perspective(2600px) rotateY(-38deg) scale(.88);transform-origin:left center}
.slide[data-trans=circle]{opacity:1;clip-path:circle(0% at 50% 50%)}
.slide[data-trans=circle].active{clip-path:circle(150% at 50% 50%)}
.slide[data-trans=wipe]{opacity:1;clip-path:inset(0 100% 0 0)}
.slide[data-trans=wipe].active{clip-path:inset(0 0 0 0)}
.slide[data-trans=iris]{opacity:1;clip-path:circle(0% at 80% 20%)}
.slide[data-trans=iris].active{clip-path:circle(150% at 80% 20%)}
/* el estado «activo» manda sobre el de partida de cada transición (misma especificidad: sin esto, ganaba el que iba después) */
.slide.active[data-trans=zoom],.slide.active[data-trans=slide],.slide.active[data-trans=rise],.slide.active[data-trans=flip],.slide.leaving[data-trans]{transform:none;filter:none}
.slide.leaving[data-trans=circle],.slide.leaving[data-trans=wipe],.slide.leaving[data-trans=iris]{clip-path:none}
.slide.dark{background:radial-gradient(circle at 80% 20%,#1f6b55 0%,#12332b 62%);color:var(--crema)}
.slide.light{background:radial-gradient(circle at 12% 0%,#f7fbf8 0%,var(--menta) 55%,#dcebe2 100%);color:var(--tinta)}
.bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fl{position:absolute;font-family:var(--display);font-style:italic;color:#fff;opacity:.07;white-space:nowrap;
  animation:flota var(--d,18s) ease-in-out infinite alternate}
@keyframes flota{from{transform:translate(0,0) rotate(var(--r0,-4deg))}to{transform:translate(var(--dx,40px),var(--dy,-60px)) rotate(var(--r1,5deg))}}

/* ── Texto ─────────────────────────────────────────────────────────────── */
.abs{position:absolute}
.lbl{font-family:var(--mono);font-size:27px;letter-spacing:.2em;text-transform:uppercase;color:var(--oro2)}
.dark .lbl{color:var(--oro-claro)}
.top{position:absolute;left:120px;top:78px}
.foot,.foot2{position:absolute;bottom:62px;font-family:var(--mono);font-size:25px;letter-spacing:.2em;text-transform:uppercase;color:var(--oro2)}
.foot{left:120px}.foot2{right:120px}
.dark .foot,.dark .foot2{color:var(--oro-claro)}
.h1{font-family:var(--display);font-weight:400;font-size:178px;line-height:.98;letter-spacing:-.01em}
.h2{font-family:var(--display);font-weight:400;font-size:112px;line-height:1.02}
.h3{font-family:var(--display);font-weight:500;font-size:64px;line-height:1.1}
.h1 em,.h2 em,.h3 em{font-style:italic;color:var(--oro)}
.dark .h1 em,.dark .h2 em,.dark .h3 em{color:var(--oro-claro)}
.lead{font-size:42px;line-height:1.35;color:var(--suave);font-weight:400}
.dark .lead{color:#bfd6cc}
.p{font-size:34px;line-height:1.45;color:var(--suave)}
.dark .p{color:#bfd6cc}
.rule{width:150px;height:5px;background:var(--oro);border-radius:3px;margin:34px 0}
.dark .rule{background:var(--oro-claro)}
.mono{font-family:var(--mono)}
em.i{font-style:italic}
.nas{color:var(--nas)}.sif{color:var(--sif)}.vib{color:var(--vib)}.chu{color:var(--chu)}

/* ── Construcción por pasos (clic a clic) ──────────────────────────────── */
.b{opacity:0;transform:translateY(46px) scale(.98);transition:opacity .75s ease,transform .85s cubic-bezier(.2,.85,.2,1)}
.b.on{opacity:1;transform:none}
.b[data-fx=pop]{transform:scale(.35)}
.b[data-fx=left]{transform:translateX(-140px)}
.b[data-fx=right]{transform:translateX(140px)}
.b[data-fx=blur]{filter:blur(24px);transform:scale(1.1)}
.b[data-fx=wipe]{transform:none;clip-path:inset(0 100% 0 0);opacity:1;transition:clip-path 1s cubic-bezier(.7,0,.2,1)}
.b[data-fx=wipe].on{clip-path:inset(0 0 0 0)}
.b[data-fx=flip]{transform:perspective(900px) rotateX(-85deg);transform-origin:top center}
.b[data-fx=flip].on{transform:none}
.b.on[data-fx]{opacity:1;transform:none;filter:none}
.b.off{opacity:0!important;transform:scale(.96);visibility:hidden;transition:opacity .5s,transform .5s,visibility 0s .5s}
.bo{opacity:0;transition:opacity .7s ease}.bo.on{opacity:1}.bo.off{opacity:0}
.ln{fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.1s cubic-bezier(.6,0,.2,1)}
.ln.on{stroke-dashoffset:0}
.ln.dots{opacity:0;transition:opacity 2s .6s}.ln.dots.on{opacity:.8}

/* ── Animaciones automáticas al entrar ─────────────────────────────────── */
.slide.active .a-up{animation:aUp 1s cubic-bezier(.2,.85,.2,1) both}
.slide.active .a-fade{animation:aFade 1.6s ease both}
.slide.active .d1{animation-delay:.25s}.slide.active .d2{animation-delay:.5s}.slide.active .d3{animation-delay:.75s}
.slide.active .a-pop{animation:aPop .9s cubic-bezier(.2,1.4,.3,1) both}
@keyframes aUp{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes aFade{from{opacity:0}to{opacity:1}}
@keyframes aPop{from{opacity:0;transform:scale(.3) rotate(-8deg)}to{opacity:1;transform:none}}
.slide.active .ghost{animation:gFade 1.8s ease both}
@keyframes gFade{from{opacity:0}to{opacity:.07}}
.shimmer{background:linear-gradient(100deg,var(--oro-claro) 20%,#fff7dd 45%,var(--oro-claro) 70%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:brilla 4s linear infinite}
@keyframes brilla{from{background-position:120% 0}to{background-position:-120% 0}}

/* ── Fichas de palabras (clic = escuchar) ──────────────────────────────── */
.chip{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:6px;text-align:left;
  background:#fff;border:2px solid color-mix(in srgb,var(--c) 45%,transparent);border-left:10px solid var(--c);border-radius:26px;padding:20px 30px;
  cursor:pointer;font:inherit;color:var(--tinta);box-shadow:0 14px 34px rgba(18,51,43,.10)}
.chip[data-c=nas]{--c:var(--nas)}.chip[data-c=sif]{--c:var(--sif)}.chip[data-c=vib]{--c:var(--vib)}.chip[data-c=chu]{--c:var(--chu)}
.chip .w{font-family:var(--display);font-size:64px;font-weight:500;line-height:1}
.chip .ipa{font-family:var(--mono);font-size:26px;color:var(--c)}
.chip::after{content:"♪";position:absolute;right:24px;top:18px;font-size:30px;color:var(--c);opacity:.55}
.chip:hover{transform:translateY(-4px)}
.chip.say{animation:latido .6s ease}
@keyframes latido{40%{transform:scale(1.07);box-shadow:0 0 0 14px color-mix(in srgb,var(--c) 22%,transparent)}}
.cu .chip{padding:12px 26px}.cu .chip .w{font-size:52px}
.pill{display:inline-block;font-family:var(--mono);font-size:26px;letter-spacing:.12em;text-transform:uppercase;padding:10px 24px;border-radius:999px;
  background:color-mix(in srgb,var(--c,var(--oro)) 16%,#fff);color:var(--c,var(--oro2));border:2px solid color-mix(in srgb,var(--c,var(--oro)) 55%,transparent)}
.btn{font:inherit;font-family:var(--mono);font-size:28px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border:0;border-radius:999px;
  padding:18px 40px;background:linear-gradient(135deg,#12332b,var(--bosque));color:var(--crema);box-shadow:0 12px 28px rgba(18,51,43,.3);transition:transform .2s}
.btn:hover{transform:translateY(-3px)}
.btn.gold{background:linear-gradient(135deg,var(--oro2),var(--oro));color:#fff}
.btn.ghost{background:transparent;color:var(--tinta);box-shadow:none;border:2px solid var(--oro)}
.card{background:#fff;border:2px solid rgba(165,130,74,.35);border-radius:34px;box-shadow:0 18px 44px rgba(18,51,43,.10)}

/* resaltados de sonido dentro de las palabras */
.hn,.hs,.hz,.hc{font-style:normal;border-radius:10px;padding:0 6px;margin:0 -2px}
.hn{background:color-mix(in srgb,var(--nas) 22%,transparent);color:var(--nas)}
.hs{background:color-mix(in srgb,var(--sif) 22%,transparent);color:var(--sif)}
.hz{background:color-mix(in srgb,var(--vib) 26%,transparent);color:#9a6a00}
.hc{background:color-mix(in srgb,var(--chu) 22%,transparent);color:var(--chu)}
.dark .hs{color:#5be3b3}.dark .hz{color:#ffd166}.dark .hn{color:#8cc4f5}.dark .hc{color:#ff9fba}
.hz.buzz{display:inline-block;animation:vibra .12s linear infinite}
@keyframes vibra{0%{transform:translate(0,0)}25%{transform:translate(1.5px,-1.5px)}50%{transform:translate(-1.5px,1px)}75%{transform:translate(1px,1.5px)}100%{transform:translate(0,0)}}
.hs.sss{display:inline-block;animation:sisea 2.4s ease-in-out infinite}
@keyframes sisea{50%{transform:scaleX(1.18) skewX(-8deg)}}

/* ── Interfaz fuera del escenario ──────────────────────────────────────── */
#ui{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none}
#prog{height:5px;background:rgba(255,255,255,.08)}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--oro),var(--oro-claro));transition:width .5s ease}
#count{position:fixed;right:14px;bottom:14px;font:12px var(--mono);letter-spacing:.1em;color:#fff;background:rgba(18,51,43,.7);padding:6px 12px;border-radius:999px;pointer-events:none;opacity:.85}
#tools{position:fixed;right:14px;top:14px;z-index:30;display:flex;gap:8px;transition:opacity .4s}
#tools button{font:600 13px var(--mono);background:rgba(18,51,43,.78);color:#e9dcb7;border:1px solid rgba(217,189,134,.5);border-radius:999px;padding:8px 14px;cursor:pointer}
#tools button:hover{background:rgba(31,107,85,.95)}
body.quiet #tools{opacity:0}
#notes{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(10,24,19,.95);color:#f3eee2;padding:18px 32px 24px;font:16px/1.55 var(--sans);display:none;border-top:2px solid var(--oro)}
#notes.on{display:block}
#notes b{font-family:var(--mono);color:var(--oro-claro);letter-spacing:.14em;font-size:12px;text-transform:uppercase;display:block;margin-bottom:6px}
#help{position:fixed;inset:0;z-index:40;background:rgba(6,19,15,.92);color:#f3eee2;display:none;place-items:center;font:20px/1.9 var(--sans)}
#help.on{display:grid}#help div{max-width:620px}#help kbd{font-family:var(--mono);background:#1f6b55;padding:2px 10px;border-radius:8px;margin-right:6px}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:50;background:#12332b;color:#e9dcb7;border:1px solid var(--oro);padding:10px 22px;border-radius:999px;font:600 14px var(--mono);opacity:0;transition:opacity .4s;pointer-events:none}
#toast.on{opacity:1}
canvas.scope{display:block;width:100%;height:100%}
@media print{#tools,#ui,#count{display:none}}
@media (prefers-reduced-motion:reduce){.fl,.shimmer,.hz.buzz,.hs.sss{animation:none!important}}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<div id="ui"><div id="prog"><i></i></div></div>
<div id="count"></div>
<div id="tools"><button id="bSound" title="Sonido (S)">♪ SON</button><button id="bNotes" title="Notas (N)">NOTES</button><button id="bFull" title="Pantalla completa (F)">⛶</button><button id="bHelp" title="Ayuda (?)">?</button></div>
<div id="notes"></div>
<div id="help"><div><b style="font:600 14px var(--mono);letter-spacing:.2em;color:#d9bd86">ATAJOS</b><br>
<kbd>→</kbd><kbd>espacio</kbd><kbd>clic</kbd> avanzar un paso<br><kbd>←</kbd> retroceder<br><kbd>F</kbd> pantalla completa<br>
<kbd>N</kbd> notas de la clase (con los tiempos)<br><kbd>S</kbd> sonido sí / no<br><kbd>B</kbd> saltar o incluir las diapositivas bonus<br>
<kbd>1</kbd>–<kbd>9</kbd> · <kbd>Inicio</kbd> · <kbd>Fin</kbd> ir a otra diapositiva<br>Las fichas de palabras suenan al hacer clic.</div></div>
<div id="toast"></div>

<script>
/* ═══ 1. AUDIO: el silbido de la serpiente y el zumbido de la abeja se generan aquí ═══ */
let AC = null, soundOn = true;
function ac(){ if (!AC){ const C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function ruido(a, d){ const n = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, n, a.sampleRate), x = buf.getChannelData(0);
  for (let i = 0; i < n; i++) x[i] = Math.random() * 2 - 1; const s = a.createBufferSource(); s.buffer = buf; return s; }
/* [s]: ruido agudo, sin voz */
function hiss(d = 1.7){ if (!soundOn) return; const a = ac(); if (!a) return; const t = a.currentTime;
  const s = ruido(a, d), hp = a.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 4800;
  const g = a.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.32, t + .18); g.gain.setValueAtTime(.32, t + d - .35); g.gain.linearRampToValueAtTime(0, t + d);
  s.connect(hp); hp.connect(g); g.connect(a.destination); s.start(t); }
/* [z]: el mismo ruido, pero con la voz (un pulso grave) por debajo: eso es «vibrar» */
function buzz(d = 1.7){ if (!soundOn) return; const a = ac(); if (!a) return; const t = a.currentTime;
  const s = ruido(a, d), hp = a.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3800;
  const am = a.createGain(); am.gain.value = .12; const lfo = a.createOscillator(); lfo.frequency.value = 95; const lg = a.createGain(); lg.gain.value = .12; lfo.connect(lg); lg.connect(am.gain);
  const voz = a.createOscillator(); voz.type = 'sawtooth'; voz.frequency.value = 118; const vg = a.createGain(); vg.gain.value = .07;
  const g = a.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.9, t + .18); g.gain.setValueAtTime(.9, t + d - .35); g.gain.linearRampToValueAtTime(0, t + d);
  s.connect(hp); hp.connect(am); am.connect(g); voz.connect(vg); vg.connect(g); g.connect(a.destination);
  lfo.start(t); voz.start(t); s.start(t); lfo.stop(t + d); voz.stop(t + d); }
function speak(txt, rate = .82){ if (!soundOn || !('speechSynthesis' in window)) return; try{
  speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(txt); u.lang = 'fr-FR'; u.rate = rate;
  const v = speechSynthesis.getVoices().find(v => /^fr/i.test(v.lang)); if (v) u.voice = v; speechSynthesis.speak(u); }catch(e){} }

/* ═══ 2. DIBUJOS (SVG) reutilizables ═══ */
const SVG_SNAKE_HEAD = `<svg viewBox="0 0 150 110" width="150" height="110"><defs><linearGradient id="gs" x1="0" x2="1"><stop offset="0" stop-color="#1f9d73"/><stop offset="1" stop-color="#0d6b4c"/></linearGradient></defs>
  <g class="tong"><path d="M120 55 L168 55 M150 55 L168 42 M150 55 L168 68" stroke="#e0485f" stroke-width="5" fill="none" stroke-linecap="round"/></g>
  <path d="M6 20 C40 4 100 4 130 40 C140 52 140 58 130 70 C100 106 40 106 6 90 Z" fill="url(#gs)"/>
  <circle cx="92" cy="38" r="13" fill="#fff7dd"/><circle cx="96" cy="38" r="7" fill="#12332b"/><circle cx="98" cy="35" r="2.4" fill="#fff"/></svg>`;
const SVG_BEE = `<svg viewBox="0 0 240 170" width="240" height="170"><defs><clipPath id="cb"><ellipse cx="108" cy="98" rx="62" ry="42"/></clipPath></defs>
  <g class="wing"><ellipse cx="96" cy="44" rx="42" ry="26" transform="rotate(-18 96 44)" fill="#fff" opacity=".7"/><ellipse cx="136" cy="50" rx="36" ry="22" transform="rotate(14 136 50)" fill="#fff" opacity=".55"/></g>
  <ellipse cx="108" cy="98" rx="62" ry="42" fill="#f0b429"/>
  <g clip-path="url(#cb)"><rect x="70" y="40" width="20" height="120" fill="#12332b"/><rect x="108" y="40" width="20" height="120" fill="#12332b"/><rect x="146" y="40" width="20" height="120" fill="#12332b"/></g>
  <path d="M46 98 L12 92 L46 112 Z" fill="#12332b"/>
  <circle cx="178" cy="86" r="30" fill="#2a2a24"/><circle cx="190" cy="80" r="9" fill="#fff"/><circle cx="193" cy="80" r="4.6" fill="#12332b"/>
  <path d="M170 60 C168 36 180 24 196 22 M184 62 C192 40 208 36 222 40" stroke="#2a2a24" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M168 96 C176 106 190 106 198 98" stroke="#fff7dd" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`;
const SVG_ROSE = `<svg viewBox="0 0 420 560" width="420" height="560"><defs><radialGradient id="rg" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#ee8fa8"/><stop offset="1" stop-color="#b13c5c"/></radialGradient></defs>
  <path d="M210 270 C204 360 222 440 208 556" stroke="#1f6b55" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M212 430 C270 400 322 410 340 380 C300 372 238 384 212 430Z" fill="#2f9e74"/><path d="M206 470 C150 450 100 455 78 424 C124 418 180 430 206 470Z" fill="#2f9e74"/>
  <g class="bloom" transform="translate(210 190)">
   <g fill="url(#rg)" stroke="#8f2c49" stroke-width="3"><ellipse cx="0" cy="-92" rx="62" ry="78"/><ellipse cx="0" cy="-92" rx="62" ry="78" transform="rotate(72)"/><ellipse cx="0" cy="-92" rx="62" ry="78" transform="rotate(144)"/><ellipse cx="0" cy="-92" rx="62" ry="78" transform="rotate(216)"/><ellipse cx="0" cy="-92" rx="62" ry="78" transform="rotate(288)"/></g>
   <g fill="#e7728f" stroke="#a63a58" stroke-width="3"><ellipse cx="0" cy="-58" rx="44" ry="54" transform="rotate(36)"/><ellipse cx="0" cy="-58" rx="44" ry="54" transform="rotate(108)"/><ellipse cx="0" cy="-58" rx="44" ry="54" transform="rotate(180)"/><ellipse cx="0" cy="-58" rx="44" ry="54" transform="rotate(252)"/><ellipse cx="0" cy="-58" rx="44" ry="54" transform="rotate(324)"/></g>
   <circle r="34" fill="#c4486a" stroke="#8f2c49" stroke-width="3"/><path d="M-18 -4 C-8 -26 14 -22 14 -2 C14 14 -8 18 -10 4" fill="none" stroke="#8f2c49" stroke-width="4" stroke-linecap="round"/></g>
  <g fill="#fff" opacity=".9"><circle cx="150" cy="300" r="5"/><circle cx="276" cy="312" r="4"/><circle cx="214" cy="326" r="3.4"/></g></svg>`;
/* perfil de cabeza (mirando a la derecha) con el camino del aire */

   <h2 class="h2 a-up" style="position:absolute;left:120px;top:130px;width:1680px">Les phrases <em>qui sauvent</em></h2>
   <div class="abs" style="left:120px;top:340px;width:1680px;display:grid;grid-template-columns:1fr 1fr;gap:26px">
    ${frases.map(([f, c], i) => `<button class="chip b" data-fx="pop" data-s="${i + 1}" data-c="${c === 'cn' ? 'nas' : c === 'cv' ? 'sif' : c === 'ca' ? 'vib' : 'chu'}" data-say="${f}"><span class="w" style="font-size:44px;line-height:1.15">${f}</span></button>`).join('')}</div>
   <p class="abs b mono" data-s="7" data-fx="blur" style="left:120px;top:950px;width:1680px;text-align:center;font-size:24px;letter-spacing:.14em;color:var(--oro2)">CLIC POUR ÉCOUTER · RÉPÈTE À VOIX HAUTE</p>` });

/* 11 · À toi */
DECK.push({ theme: 'dark', trans: 'circle', label: 'À toi',
  notes: 'Minutos 40 a 46. Ejercicio guiado: cada alumno transforma una anécdota personal en argumento con los tres pasos. Un modelo aparece al final.',
  html: `${chrome('À toi', 'Transformer une anecdote')}
   <h2 class="h2 a-up" style="position:absolute;left:120px;top:130px;width:1680px">Ton anecdote, <em>ton argument</em></h2>
   <div class="abs" style="left:120px;top:320px;width:1680px;display:grid;gap:14px">
    ${[['1', 'Mon anecdote', 'Un fait vécu, en une ou deux phrases.', 'cn', 1], ['2', 'L’enjeu', 'La question générale qu’il soulève.', 'ca', 2], ['3', 'Mon point de vue', 'Une idée nuancée avec un connecteur de concession.', 'cr', 3]]
      .map(([n, t, d, c, s]) => `<div class="b vcard" data-s="${s}" data-fx="left" style="padding:8px 44px;display:grid;grid-template-columns:110px 480px 1fr;align-items:center;gap:20px"><span class="num ${c}" style="font-size:70px">${n}</span><span class="num" style="font-size:48px">${t}</span><span class="p" style="font-size:32px">${d}</span></div>`).join('')}</div>
   <div class="abs b vcard" data-s="4" data-fx="blur" style="left:120px;top:730px;width:1680px;padding:20px 44px"><div class="mono ca" style="font-size:24px;letter-spacing:.14em">UN MODÈLE POSSIBLE</div><p style="font-family:var(--display);font-style:italic;font-size:36px;line-height:1.3;margin-top:6px">« L’autre jour, ma voisine a refusé de laisser son fils avec une tablette. <b>Cela soulève la question</b> de l’éducation numérique. <b>Bien que</b> ce soit un choix difficile, il me semble nécessaire. »</p></div>` });

/* 12 · Pièges (bonus) */
DECK.push({ theme: 'light', trans: 'slide', label: 'Bonus · Les connecteurs paresseux', bonus: true,
  notes: 'Diapositiva bonus (tecla B para omitirla). De los conectores perezosos a los de nivel B2: «mais» → en revanche / cependant; «parce que» → car / puisque / étant donné que; «et» → de plus / en outre.',
  html: `${chrome('Bonus', 'Monter de niveau')}
   <h2 class="h2 a-up" style="position:absolute;left:120px;top:130px;width:1680px">Quitter <em>les mots paresseux</em></h2>
   <div class="abs" style="left:120px;top:340px;width:1680px;display:grid;gap:26px">
    ${[['mais', 'en revanche · cependant · pourtant', 1], ['parce que', 'car · puisque · étant donné que', 2], ['et', 'de plus · en outre · par ailleurs', 3], ['donc', 'par conséquent · c’est pourquoi', 4]]
      .map(([a, b, s]) => `<div class="b vcard" data-s="${s}" data-fx="right" style="padding:22px 50px;display:grid;grid-template-columns:420px 120px 1fr;align-items:center"><span class="num" style="font-size:70px;color:#b13c5c;text-decoration:line-through;text-decoration-thickness:5px">${a}</span><span class="arrow" style="font-size:70px">→</span><span class="num cv" style="font-size:52px;color:#0d6b4c">${b}</span></div>`).join('')}</div>` });

/* 13 · Cierre */
DECK.push({ theme: 'dark', trans: 'zoom', label: 'Objectif B2',
  notes: 'Minutos 46 a 50. Cierre: Objectif B2 réussi. Tarea: preparar una anécdota propia con los tres pasos (anécdota, enjeu, punto de vista) y grabarse en el espacio personal.',
  html: `<canvas id="confetti" width="1920" height="1080" class="abs" style="left:0;top:0;pointer-events:none"></canvas>
   <div class="abs" style="left:0;top:0;width:1920px;height:1080px;background:linear-gradient(90deg,rgba(24,10,20,.94) 0%,rgba(24,10,20,.82) 42%,rgba(24,10,20,.25) 78%,rgba(24,10,20,.1) 100%),url(img/delf-escalera.jpg) center top/cover;transform:scale(1.0);animation:kb 24s ease-in-out infinite alternate"></div>
   <div class="bg"><span class="fl" style="left:1200px;top:90px;font-size:290px;--d:19s">toutefois</span><span class="fl" style="left:1330px;top:520px;font-size:230px;--d:23s">certes</span></div>
   <div class="abs" style="left:120px;top:250px;width:1560px"><h1 class="h1 a-up" style="font-size:200px">Objectif <em class="shimmer">B2</em> réussi</h1>
    <div class="rule b" data-s="1" data-fx="wipe"></div>
    <p class="lead b" data-s="1" style="max-width:1300px"><b class="cn">Problématiser</b> · <b class="cv">structurer</b> · <b class="ca">nuancer</b>.</p>
    <p class="lead b" data-s="2" style="margin-top:20px">Ta mission : <em class="i" style="color:var(--oro-claro)">une anecdote, un enjeu, un point de vue</em>.</p></div>
   <div class="foot">Vive el francés</div>`,
  step: (n) => { if (n === 1) confeti(); } });


/* ═══ 4. MOTOR: pasos, transiciones, interacciones ═══ */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const stage = $('#stage'); let cur = -1, step = 0, skipBonus = false, anim = null;
/* partículas de fondo en las diapositivas oscuras */
const GLIFOS = ['bien que', 'certes', 'en revanche', 'toutefois', 'or', 'en dépit de', 'avoir beau', 'nuancer'];
function particulas(){ let h = ''; for (let i = 0; i < 9; i++){ const g = GLIFOS[(i * 3) % GLIFOS.length];
  h += `<span class="fl" style="left:${(i * 211) % 1800}px;top:${(i * 137) % 900}px;font-size:${90 + (i * 47) % 160}px;--d:${15 + (i * 3) % 14}s;--dx:${30 + i * 9}px;--dy:${-30 - i * 12}px">${g}</span>`; } return h; }
stage.innerHTML = DECK.map((d, i) => `<section class="slide ${d.theme}" data-i="${i}" data-trans="${d.trans}">${d.theme === 'dark' && !/class="bg"/.test(d.html) ? `<div class="bg">${particulas()}</div>` : ''}${d.html}</section>`).join('');
const slides = $$('.slide');
const maxStep = el => Math.max(0, ...$$('[data-s]', el).map(e => +e.dataset.s));
DECK.forEach((d, i) => d.max = maxStep(slides[i]));

function aplicar(el, n, avanzando){
  $$('[data-s]', el).forEach(e => { const s = +e.dataset.s, u = e.dataset.until ? +e.dataset.until : 1e9;
    const on = n >= s && n < u; e.classList.toggle('on', on); e.classList.toggle('off', n >= u); });
}
function render(){ const s = slides[cur]; aplicar(s, step);
  $('#prog i').style.width = ((cur + (DECK[cur].max ? step / (DECK[cur].max + 1) : 0)) / (DECK.length - 1) * 100) + '%';
  $('#count').textContent = String(cur + 1).padStart(2, '0') + ' / ' + DECK.length;
  $('#notes').innerHTML = '<b>Diapositiva ' + (cur + 1) + ' · ' + DECK[cur].label + '</b>' + DECK[cur].notes;
  history.replaceState(null, '', '#' + (cur + 1)); }
function ir(n, st = 0){ n = Math.max(0, Math.min(DECK.length - 1, n)); if (n === cur) return;
  const prev = slides[cur]; if (prev){ prev.classList.remove('active'); prev.classList.add('leaving'); setTimeout(() => prev.classList.remove('leaving'), 1100); detener(cur); }
  cur = n; step = st; const s = slides[cur]; s.classList.remove('leaving');
  /* los pasos se aplican antes de activar, para que lo ya construido no «llegue volando» al retroceder */
  aplicar(s, step); void s.offsetWidth; s.classList.add('active'); iniciar(cur); render(); disparar(cur, step); }
function siguiente(){ const d = DECK[cur]; if (step < d.max){ step++; render(); disparar(cur, step); return; }
  let n = cur + 1; while (skipBonus && DECK[n] && DECK[n].bonus) n++; if (n < DECK.length) ir(n, 0); }
function anterior(){ if (step > 0){ step--; render(); return; } let n = cur - 1; while (skipBonus && DECK[n] && DECK[n].bonus) n--; if (n >= 0) ir(n, DECK[n].max); }
function disparar(i, n){ const d = DECK[i]; if (d.step) d.step(n); }
function iniciar(i){ if (DECK[i].scopes) iniciarScopes(slides[i]); if (/data-quiz/.test(DECK[i].html)) $$('.quiz', slides[i]).forEach(q => { if (!q.dataset.ready) montarQuiz(q); }); }
function detener(i){ if (DECK[i].scopes) detenerScopes(); }

/* escala 1920×1080 al tamaño de la ventana */
function escalar(){ const k = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(-50%,-50%) scale(${k})`; }
addEventListener('resize', escalar); escalar();

/* osciloscopio: ruido sin forma para [s]; ruido + pulso regular para [z] */
let scopeRAF = null;
function iniciarScopes(el){ detenerScopes(); const cs = $$('canvas.scope', el); const t0 = performance.now();
  const dibuja = t => { cs.forEach(c => { const g = c.getContext('2d'), w = c.width, h = c.height, voiced = c.dataset.scope === 'voiced', tt = (t - t0) / 1000;
      g.clearRect(0, 0, w, h); g.lineWidth = 3; g.lineJoin = 'round'; g.strokeStyle = voiced ? '#ffd166' : '#5be3b3'; g.beginPath();
      for (let x = 0; x <= w; x += 4){ const ruido = (Math.random() - .5) * (voiced ? 70 : 120); const pulso = voiced ? Math.sin(x * .09 - tt * 28) * 70 * (0.65 + .35 * Math.sin(tt * 3)) : 0;
        const y = h / 2 + ruido * (voiced ? .6 : 1) + pulso; x ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); }); scopeRAF = requestAnimationFrame(dibuja); };
  scopeRAF = requestAnimationFrame(dibuja); }
function detenerScopes(){ if (scopeRAF) cancelAnimationFrame(scopeRAF); scopeRAF = null; }

/* confeti */
function confeti(){ const c = $('#confetti'); if (!c) return; const g = c.getContext('2d'), P = [], col = ['#d9bd86', '#1f9d73', '#3b82c4', '#cf5b7d', '#ffd166', '#f3eee2'];
  for (let i = 0; i < 220; i++) P.push({ x: Math.random() * 1920, y: -Math.random() * 900, vx: (Math.random() - .5) * 5, vy: 3 + Math.random() * 6, s: 10 + Math.random() * 16, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: col[i % col.length] });
  let f = 0; const tick = () => { g.clearRect(0, 0, 1920, 1080); P.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += p.vr; g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); g.restore(); });
    if (++f < 420) requestAnimationFrame(tick); else g.clearRect(0, 0, 1920, 1080); }; tick(); }

/* juegos de opción múltiple (nasales y S / Z) */
const QUIZ = {
  nas: { titulo: 'Quelle nasale ?', color: 'nas', opts: [['a', 'an · en'], ['i', 'in · ain'], ['o', 'on'], ['u', 'un']],
    items: [['vent', '[vɑ̃]', 'a'], ['pain', '[pɛ̃]', 'i'], ['bon', '[bɔ̃]', 'o'], ['parfum', '[paʁfœ̃]', 'u'], ['lundi', '[lœ̃di]', 'u'], ['maison', '[mɛzɔ̃]', 'o'], ['matin', '[matɛ̃]', 'i'], ['temps', '[tɑ̃]', 'a']] },
  sz: { titulo: 'Serpent ou abeille ?', color: 'vib', opts: [['s', '🐍  [s]'], ['z', '🐝  [z]']],
    items: [['sac', '[sak]', 's'], ['zéro', '[zeʁo]', 'z'], ['rose', '[ʁoz]', 'z'], ['classe', '[klas]', 's'], ['maison', '[mɛzɔ̃]', 'z'], ['merci', '[mɛʁsi]', 's'], ['musée', '[myze]', 'z'], ['garçon', '[gaʁsɔ̃]', 's']] } };
function montarQuiz(q){ const D = QUIZ[q.dataset.quiz]; q.dataset.ready = 1; let i = 0, pts = 0, resp = false; const col = `var(--${D.color})`;
  const pinta = () => { const it = D.items[i];
    q.innerHTML = `<div class="mono" style="font-size:26px;color:var(--oro2);letter-spacing:.16em">${D.titulo.toUpperCase()} · ${i + 1} / ${D.items.length} · ${pts} ✓</div>
      <div style="margin:34px 0 8px;font-family:var(--display);font-size:250px;font-weight:600;line-height:1;color:var(--tinta)">${it[0]}</div>
      <div class="mono" style="font-size:40px;color:var(--oro2);min-height:56px" id="ipa">${resp ? it[1] : '[ ? ]'}</div>
      <div style="display:flex;gap:30px;justify-content:center;margin:38px 0 22px" id="opts">${D.opts.map(o => `<button class="opt" style="--c:${col}" data-r="${o[0]}">${o[1]}</button>`).join('')}</div>
      <div class="fb" id="fb"></div>
      <div style="display:flex;gap:18px;justify-content:center;margin-top:14px"><button class="btn ghost" data-q="say">♪ Écouter</button><button class="btn" data-q="next">${i + 1 < D.items.length ? 'Suivant →' : 'Terminer ✓'}</button></div>`;
    $('[data-q=say]', q).onclick = () => speak(it[0]);
    $('[data-q=next]', q).onclick = () => { if (i + 1 < D.items.length){ i++; resp = false; pinta(); } else q.innerHTML = `<div style="margin-top:200px;font-family:var(--display);font-size:200px;color:var(--tinta)">${pts} / ${D.items.length}</div><div style="font-family:var(--display);font-style:italic;font-size:74px;color:var(--oro)">${pts > D.items.length - 2 ? 'Bravo ! Oreille d’or.' : 'Bien ! On recommence ?'}</div><button class="btn" style="margin-top:50px" data-q="again">↺ Rejouer</button>`, $('[data-q=again]', q).onclick = () => { i = 0; pts = 0; resp = false; pinta(); }; };
    $$('.opt', q).forEach(b => b.onclick = () => { if (resp) return; resp = true; const ok = b.dataset.r === it[2]; if (ok) pts++;
      b.classList.add(ok ? 'ok' : 'no'); if (!ok) $$('.opt', q).forEach(x => { if (x.dataset.r === it[2]) x.classList.add('ok'); });
      $('#ipa', q).textContent = it[1]; $('#fb', q).innerHTML = ok ? '<span style="color:var(--sif)">Oui !</span>' : `<span style="color:var(--chu)">Non… c’est ${D.opts.find(o => o[0] === it[2])[1]}</span>`;
      if (q.dataset.quiz === 'sz') (it[2] === 's' ? hiss(1) : buzz(1)); speak(it[0]); }); };
  pinta(); }

/* clics en botones, fichas y el avance general */
stage.addEventListener('click', e => {
  const chipEl = e.target.closest('.chip'); if (chipEl){ chipEl.classList.remove('say'); void chipEl.offsetWidth; chipEl.classList.add('say'); speak(chipEl.dataset.say); return; }
  const act = e.target.closest('[data-act]'); if (act){ const a = act.dataset.act;
    if (a === 'hiss') hiss(1.8); else if (a === 'buzz') buzz(1.8);
    else if (a === 'poem') speak('Siffle le serpent. Le serpent qui danse, danse et se balance, au son des cymbales, sur un air de valse que jouent les cigales.', .72);
    else if (a === 'bee') speak('Une abeille se pose sur une belle rose et vient l’arroser. Laquelle ? La rosée !', .72);
    else if (a === 'twister-slow') speak('Si six scies scient six cyprès, six cent six scies scient six cent six cyprès.', .6);
    else if (a === 'twister-fast') speak('Si six scies scient six cyprès, six cent six scies scient six cent six cyprès.', 1.15);
    const r = act.parentElement; if (a === 'buzz'){ } return; }
  const say = e.target.closest('[data-say]'); if (say){ speak(say.dataset.say); return; }
  if (e.target.closest('button,a,.quiz')) return;
  siguiente(); });

/* teclado, ayuda, notas, sonido */
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1600); }
function pantalla(){ if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }
addEventListener('keydown', e => { if (e.metaKey || e.ctrlKey || e.altKey) return; const k = e.key;
  if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'ArrowDown'){ e.preventDefault(); siguiente(); }
  else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'ArrowUp'){ e.preventDefault(); anterior(); }
  else if (k === 'Home') ir(0); else if (k === 'End') ir(DECK.length - 1);
  else if (/^[1-9]$/.test(k)) ir(+k - 1);
  else if (k === 'f' || k === 'F') pantalla();
  else if (k === 'n' || k === 'N') $('#notes').classList.toggle('on');
  else if (k === 's' || k === 'S'){ soundOn = !soundOn; if (!soundOn && 'speechSynthesis' in window) speechSynthesis.cancel(); $('#bSound').textContent = soundOn ? '♪ SON' : '✕ SON'; toast(soundOn ? 'Sonido activado' : 'Sonido desactivado'); }
  else if (k === 'b' || k === 'B'){ skipBonus = !skipBonus; toast(skipBonus ? 'Bonus omitido' : 'Bonus incluido'); }
  else if (k === '?' || k === 'h' || k === 'H') $('#help').classList.toggle('on');
  else if (k === 'Escape'){ $('#help').classList.remove('on'); $('#notes').classList.remove('on'); } });
$('#bSound').onclick = e => { e.stopPropagation(); soundOn = !soundOn; $('#bSound').textContent = soundOn ? '♪ SON' : '✕ SON'; if (!soundOn && 'speechSynthesis' in window) speechSynthesis.cancel(); };
$('#bNotes').onclick = () => $('#notes').classList.toggle('on'); $('#bFull').onclick = pantalla; $('#bHelp').onclick = () => $('#help').classList.toggle('on');
$('#help').onclick = () => $('#help').classList.remove('on');
/* los controles se esconden cuando se proyecta */
let idle; const despierta = () => { document.body.classList.remove('quiet'); clearTimeout(idle); idle = setTimeout(() => document.body.classList.add('quiet'), 3200); };
['mousemove', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, despierta)); despierta();
/* gesto táctil */
let tx = null; addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(dx) > 60){ dx < 0 ? siguiente() : anterior(); } }, { passive: true });
if ('speechSynthesis' in window) speechSynthesis.getVoices();
const m = /^#(\d+)$/.exec(location.hash); ir(m ? +m[1] - 1 : 0, 0);
addEventListener('hashchange', () => { const h = /^#(\d+)$/.exec(location.hash); if (h && +h[1] - 1 !== cur) ir(+h[1] - 1, 0); });
/* sin extras */

</script>
