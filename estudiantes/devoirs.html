<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Mes devoirs | Professeur Miguel Tillero</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
   MES DEVOIRS · mismo lenguaje visual que el resto del sitio: malaquita con
   vetas doradas, Cormorant Garamond para los títulos y Syne para el texto.
   (Antes heredaba la hoja de las fichas, azul marino con Playfair y Lato, y
   se veía como otra página.)
   =========================================================================== */
:root{
  --noche:#082a1f; --bosque:#0d4b38; --esmeralda:#0d7f57; --menta:#c5e0d3; --menta2:#e8f2ed;
  --oro:#a5824a; --oro2:#86673a; --oro-claro:#e3c98f;
  --tinta:#12291c; --suave:rgba(18,41,28,.74); --borde:rgba(165,130,74,.38);
  --carta:rgba(255,255,255,.96); --ombre:0 14px 40px rgba(20,45,32,.10); --ombre-fuerte:0 22px 50px rgba(20,45,32,.18);
  --terre:#b4532f;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Syne',sans-serif;color:var(--tinta);line-height:1.65;
  background:radial-gradient(ellipse 90% 70% at 50% 0%,#d6ebe0 0%,#c5e0d3 45%,#a9cfc0 100%);background-attachment:fixed;min-height:100vh}
a{color:var(--esmeralda)}

/* ── Cabecera: malaquita con una veta dorada ───────────────────────────── */
header.hero{position:relative;overflow:hidden;color:#f4efe2;text-align:center;
  padding:clamp(2.6rem,7vw,4.2rem) 20px clamp(5rem,11vw,7rem);
  background:
    radial-gradient(ellipse 60% 90% at 85% 10%,rgba(60,170,130,.45) 0%,transparent 60%),
    radial-gradient(ellipse 70% 80% at 10% 100%,rgba(13,127,87,.40) 0%,transparent 65%),
    linear-gradient(135deg,var(--noche) 0%,var(--bosque) 55%,#0b3a2c 100%)}
header.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--oro-claro),var(--oro),var(--oro-claro),transparent)}
.veta{position:absolute;inset:0;width:100%;height:100%;opacity:.55;pointer-events:none}
.veta path{fill:none;stroke:url(#oroVeta);stroke-width:1.6;stroke-linecap:round;
  stroke-dasharray:1400;stroke-dashoffset:1400;animation:dibuja 3.2s .2s ease-out forwards}
.veta path.v2{stroke-width:1;opacity:.7;animation-delay:.7s}
@keyframes dibuja{to{stroke-dashoffset:0}}
.retorno{position:absolute;top:1rem;left:max(16px,calc(50% - 460px));z-index:3;font-size:.8rem;letter-spacing:.08em;
  color:var(--oro-claro);text-decoration:none;padding:.45rem .9rem;border:1px solid rgba(227,201,143,.45);border-radius:999px;
  background:rgba(8,42,31,.35);backdrop-filter:blur(4px);transition:.2s}
.retorno:hover{background:rgba(227,201,143,.18)}
.hero .contenido{position:relative;z-index:2;max-width:720px;margin:0 auto}
.sello{display:inline-block;padding:.4rem 1.1rem;border:1px solid rgba(227,201,143,.55);border-radius:999px;
  font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--oro-claro);background:rgba(8,42,31,.35)}
.hero h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(2.6rem,9vw,4.4rem);line-height:1.05;margin:1rem 0 .7rem}
.hero h1 em{font-style:italic;color:var(--oro-claro)}
.hero p.lead{max-width:52ch;margin:0 auto;color:rgba(244,239,226,.82);font-size:1rem}

/* ── Resumen: cuántos hay por hacer ────────────────────────────────────── */
.contenedor{max-width:860px;margin:0 auto;padding:0 16px 3rem;position:relative}
.resumen{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin:-3.2rem auto 1.8rem;position:relative;z-index:5}
.dato{background:var(--carta);border:1px solid var(--borde);border-radius:18px;box-shadow:var(--ombre);
  padding:1rem .6rem;text-align:center}
.dato b{display:block;font-family:'Syne',sans-serif;font-weight:700;font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.1;color:var(--esmeralda)}
.dato.pendiente b{color:var(--oro2)}
.dato span{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--suave)}

/* ── Tarjeta de deber ──────────────────────────────────────────────────── */
.deber{position:relative;background:var(--carta);border:1px solid var(--borde);border-radius:22px;box-shadow:var(--ombre);
  padding:0;margin-bottom:1.6rem;overflow:hidden;animation:sube .6s both}
.deber:nth-child(2){animation-delay:.08s}.deber:nth-child(3){animation-delay:.16s}.deber:nth-child(4){animation-delay:.24s}
@keyframes sube{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.deber::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--oro-claro),var(--oro))}
.deber.hecho::before{background:linear-gradient(180deg,#53b58d,var(--esmeralda))}
.deber-cab{display:flex;gap:1.1rem;align-items:flex-start;padding:1.5rem 1.5rem 0 1.8rem}
.fecha{flex:none;width:4.2rem;text-align:center;border:1px solid var(--borde);border-radius:14px;overflow:hidden;background:#fff}
.fecha i{display:block;font-style:normal;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:#fff;
  background:linear-gradient(135deg,var(--bosque),var(--esmeralda));padding:.25rem 0}
.fecha b{display:block;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:2rem;line-height:1.15;padding:.1rem 0 .25rem;color:var(--tinta)}
.deber-cab h2{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(1.5rem,4.6vw,1.95rem);line-height:1.15;margin:.1rem 0 .5rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{display:inline-flex;align-items:center;gap:.4rem;padding:.28rem .8rem;border-radius:999px;font-size:.74rem;
  letter-spacing:.05em;font-weight:600;border:1px solid var(--borde);background:#fff;color:var(--suave)}
.chip.plazo{color:var(--oro2);border-color:rgba(165,130,74,.55);background:rgba(227,201,143,.18)}
.chip.urgente{color:var(--terre);border-color:rgba(180,83,47,.45);background:rgba(180,83,47,.08)}
.chip.rendu{color:#0a6a49;border-color:rgba(13,127,87,.45);background:rgba(13,127,87,.10)}
.chip.corrige{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--bosque),var(--esmeralda))}
.deber-cuerpo{padding:1.1rem 1.5rem 1.6rem 1.8rem}

/* Etapas: fichas → texto → entregado */
.etapas{display:flex;align-items:center;gap:.4rem;margin:.2rem 0 1.1rem;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--suave)}
.etapa{display:flex;align-items:center;gap:.45rem}
.etapa .bola{width:1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;
  border:1.5px solid var(--borde);background:#fff;color:var(--oro2);transition:.3s}
.etapa.ok .bola{background:var(--esmeralda);border-color:var(--esmeralda);color:#fff}
.etapa.ok{color:var(--esmeralda)}
.linea{flex:1;height:1.5px;background:var(--borde);min-width:.8rem}

.consigna p{margin-bottom:.8rem;font-size:1.02rem}
.consigna b{color:var(--bosque)}
.consigna .pista{position:relative;background:linear-gradient(135deg,rgba(227,201,143,.22),rgba(227,201,143,.08));
  border:1px solid rgba(165,130,74,.35);border-radius:14px;padding:.8rem 1rem .8rem 2.6rem;font-size:.94rem}
.consigna .pista::before{content:"✦";position:absolute;left:1rem;top:.75rem;color:var(--oro);font-size:1rem}

.boton-ficha{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin:1rem 0 1.2rem;padding:.9rem 1.1rem;
  text-decoration:none;color:var(--tinta);border:1px solid var(--borde);border-radius:14px;background:var(--menta2);transition:.2s}
.boton-ficha:hover{transform:translateY(-2px);box-shadow:var(--ombre);background:#fff}
.boton-ficha small{display:block;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--oro2)}
.boton-ficha strong{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.25rem}
.boton-ficha .flecha{font-size:1.4rem;color:var(--esmeralda)}

.zona{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--oro2);font-weight:700;margin:.2rem 0 .4rem}
textarea{width:100%;min-height:11rem;padding:1rem 1.1rem;border:1.5px solid rgba(165,130,74,.45);border-radius:16px;
  font:inherit;font-size:1.02rem;line-height:1.7;background:#fff;color:var(--tinta);resize:vertical;transition:.2s}
textarea::placeholder{color:rgba(18,41,28,.4);font-style:italic}
textarea:focus{outline:none;border-color:var(--esmeralda);box-shadow:0 0 0 4px rgba(13,127,87,.14)}
.progreso{height:5px;border-radius:999px;background:rgba(165,130,74,.2);margin:.55rem 0 .2rem;overflow:hidden}
.progreso i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--oro),var(--esmeralda));transition:width .4s}
.fila{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;margin-top:.9rem}
.cuenta{color:var(--suave);font-size:.86rem}
.borrador{margin-left:auto;font-size:.78rem;color:var(--oro2);opacity:0;transition:.4s}
.borrador.visible{opacity:1}
.archivo{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:1rem;padding:1rem 1.1rem;
  border:1.5px dashed rgba(165,130,74,.55);border-radius:16px;background:rgba(227,201,143,.10);font-size:.9rem}
.archivo input{font:inherit;font-size:.85rem;max-width:100%}

.boton{display:inline-flex;align-items:center;gap:.5rem;padding:.8rem 1.7rem;border-radius:999px;border:0;cursor:pointer;
  background:linear-gradient(135deg,var(--bosque),var(--esmeralda));color:#fff;font:inherit;font-weight:700;font-size:.92rem;
  letter-spacing:.06em;box-shadow:0 8px 22px rgba(13,127,87,.32);transition:.2s}
.boton:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(13,127,87,.4)}
.boton:disabled{opacity:.55;cursor:default;transform:none}
.boton:focus-visible,.boton-ficha:focus-visible,.retorno:focus-visible{outline:3px solid var(--oro);outline-offset:3px}
.aviso{margin-top:.8rem;font-size:.94rem}
.aviso.err{color:var(--terre)}
.aviso.ok{color:#0a6a49;font-weight:600}

/* Comentario del profesor: una carta pequeña */
.comentario{margin-top:1.3rem;padding:1.2rem 1.3rem;border-radius:16px;background:#fffdf7;border:1px solid rgba(165,130,74,.4);position:relative}
.comentario b{display:block;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--oro2);margin-bottom:.5rem}
.comentario p{font-family:'Cormorant Garamond',serif;font-size:1.2rem;line-height:1.55;color:var(--tinta);text-align:left}
.mensaje{background:var(--carta);border:1px solid var(--borde);border-radius:22px;box-shadow:var(--ombre);padding:2rem 1.6rem;
  font-size:1.05rem;text-align:center;margin-top:-3rem;position:relative;z-index:5}
.mensaje a{font-weight:700}

footer.firma{max-width:860px;margin:0 auto;padding:1rem 16px 4rem;text-align:center}
footer.firma p{font-size:.9rem;color:var(--suave);margin-bottom:.7rem}
footer.firma img{max-width:min(100%,420px);height:auto;border-radius:14px;box-shadow:0 10px 30px rgba(20,45,32,.18)}
footer.firma a.vol{display:block;margin-top:1.4rem;font-size:.9rem}

@media (max-width:560px){
  .deber-cab{flex-direction:column;gap:.7rem;padding:1.3rem 1.1rem 0 1.3rem}
  .fecha{display:flex;width:auto;align-items:stretch}
  .fecha i{writing-mode:horizontal-tb;padding:.35rem .8rem;display:grid;place-items:center}
  .fecha b{padding:.1rem .9rem;font-size:1.6rem}
  .deber-cuerpo{padding:1rem 1.1rem 1.4rem 1.3rem}
  .etapas{font-size:.64rem}
  .resumen{gap:.5rem}
  .dato span{font-size:.6rem}
  .borrador{margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .veta path{stroke-dashoffset:0}
}

/* ═══ MODO INMERSIVO · cada deber se hace paso a paso ═══════════════════════════
   El listado sigue siendo claro y ligero; al abrir un deber se entra a una pantalla completa en malaquita,
   con una sola tarea por paso (comprender → preparar → escribir → releer → rendre → bilan).
   Apoyo pedagógico: una idea por pantalla (segmentación, Mayer); objetivo y criterios visibles antes de escribir
   (¿adónde voy?); autoevaluación con lista de relectura antes de entregar (autorregulación); y un balance al final
   con qué hacer después (¿qué sigue?), sin elogios ni reproches a la persona, solo a lo hecho. */
.estados-mini{display:flex;flex-wrap:wrap;gap:.45rem;margin:.2rem 0 1rem}
.btn-abrir{display:inline-flex;align-items:center;gap:.55rem;padding:.85rem 1.8rem;border-radius:999px;border:0;cursor:pointer;
  background:linear-gradient(135deg,var(--bosque),var(--esmeralda));color:#fff;font:inherit;font-weight:700;font-size:.95rem;letter-spacing:.05em;
  box-shadow:0 8px 22px rgba(13,127,87,.32);transition:.2s}
.btn-abrir:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(13,127,87,.4)}
.btn-abrir.suave{background:#fff;color:var(--bosque);border:1.5px solid var(--borde);box-shadow:none}
.resumen-corto{font-size:.92rem;color:var(--suave);margin:.2rem 0 1rem}

#flujo{position:fixed;inset:0;z-index:100;display:none;color:#f3eee2;font-family:'Syne',sans-serif;
  background:radial-gradient(circle at 85% 0%,#1f6b55 0%,#12332b 55%,#0b2018 100%)}
#flujo.on{display:block}
#flujo *{box-sizing:border-box}
#fx-hud{position:absolute;left:0;right:0;top:0;padding:calc(12px + env(safe-area-inset-top)) 16px 0;z-index:3;background:linear-gradient(#0b2018 40%,transparent)}
#fx-top{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:10px}
#fx-salir{flex:none;font:600 .8rem 'Syne',sans-serif;color:#d9bd86;background:transparent;border:1px solid rgba(217,189,134,.45);border-radius:999px;padding:.4rem .9rem;cursor:pointer}
#fx-pips{flex:1;display:flex;align-items:center}
.fx-pip{display:flex;align-items:center;gap:6px;font:11px 'Space Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:#6f8f82;flex:none}
.fx-pip i{width:24px;height:24px;border-radius:50%;border:2px solid #3f6556;display:grid;place-items:center;font-style:normal;font-size:11px;transition:all .5s}
.fx-pip.on{color:#d9bd86}.fx-pip.on i{border-color:#d9bd86;background:rgba(217,189,134,.15)}
.fx-pip.done i{background:#d9bd86;border-color:#d9bd86;color:#12332b}.fx-pip.done{color:#bfd6cc}
.fx-linea{flex:1;height:2px;background:#2d5143;margin:0 6px;min-width:6px;position:relative;overflow:hidden}
.fx-linea.done{background:#d9bd86}
@media (max-width:700px){.fx-pip span{display:none}}
#fx-stage{position:absolute;inset:0;padding:calc(70px + env(safe-area-inset-top)) 0 calc(86px + env(safe-area-inset-bottom));overflow:hidden}
.fx-slide{height:100%;overflow-y:auto;padding:14px 20px 24px;animation:fxEntra .5s cubic-bezier(.2,.85,.2,1) both}
.fx-slide.atras{animation-name:fxAtras}
@keyframes fxEntra{from{opacity:0;transform:translateX(7%)}to{opacity:1;transform:none}}
@keyframes fxAtras{from{opacity:0;transform:translateX(-7%)}to{opacity:1;transform:none}}
.fx-in{max-width:820px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center}
.fx-lbl{font:12px 'Space Mono',ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;color:#d9bd86}
.fx-h{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(34px,7vw,64px);line-height:1.02;margin:8px 0 14px}
.fx-h em{font-style:italic;color:#d9bd86}
.fx-lead{font-size:clamp(16px,2.2vw,19px);color:#cfe0d8;max-width:62ch;line-height:1.6}
.fx-nota{border-left:4px solid #d9bd86;background:rgba(217,189,134,.1);border-radius:12px;padding:12px 16px;margin:14px 0;font-size:16px;max-width:64ch}
.fx-nota b{color:#d9bd86}
.fx-consigna{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(21px,3vw,27px);line-height:1.4;color:#fff;background:rgba(0,0,0,.2);border-radius:18px;padding:16px 20px;margin:12px 0}
.fx-consigna p{margin:0 0 .6rem}.fx-consigna b{color:#d9bd86}
.fx-consigna .pista{font-family:'Syne',sans-serif;font-size:15px;color:#cfe0d8;border:1px dashed rgba(217,189,134,.5);border-radius:12px;padding:10px 14px}
.fx-chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.fx-chip{font:13px 'Space Mono',ui-monospace,monospace;border:1.5px solid rgba(217,189,134,.5);border-radius:999px;padding:4px 12px;color:#e9f1ec}
.fx-ed{width:100%;min-height:38vh;font:500 clamp(20px,2.8vw,26px)/1.45 'Cormorant Garamond',Georgia,serif;color:#fff;background:rgba(0,0,0,.25);border:1.5px solid rgba(255,255,255,.28);border-radius:18px;padding:16px 18px;outline:none;resize:vertical}
.fx-ed:focus{border-color:#d9bd86}
.fx-plan{min-height:22vh;font-size:clamp(18px,2.4vw,22px)}
.fx-fila{display:flex;align-items:center;gap:16px;margin-top:12px;flex-wrap:wrap}
.fx-anillo{width:70px;height:70px;position:relative;flex:none}.fx-anillo svg{transform:rotate(-90deg)}
.fx-anillo b{position:absolute;inset:0;display:grid;place-items:center;font:600 14px 'Space Mono',ui-monospace,monospace;color:#d9bd86}
.fx-cuenta{font-size:15px;color:#cfe0d8}.fx-guardado{margin-left:auto;font-size:13px;color:#d9bd86;opacity:0;transition:.4s}.fx-guardado.on{opacity:1}
.fx-checks{list-style:none;display:grid;gap:10px;margin:14px 0}
.fx-checks label{display:flex;gap:14px;align-items:center;padding:14px 16px;border:1.5px solid rgba(255,255,255,.22);border-radius:16px;background:rgba(255,255,255,.05);cursor:pointer;font-size:clamp(16px,2.3vw,19px);line-height:1.35}
.fx-checks input{width:22px;height:22px;accent-color:#d9bd86;flex:none}
.fx-checks label.si{border-color:#8fd3b6;background:rgba(143,211,182,.09)}
.fx-resumen{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.fx-resumen div{border:1.5px solid rgba(217,189,134,.4);border-radius:16px;padding:12px;text-align:center;background:rgba(255,255,255,.05)}
.fx-resumen b{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(28px,5vw,40px);color:#d9bd86;line-height:1.1}
.fx-resumen span{font:11px 'Space Mono',ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:#bfd6cc}
.fx-archivo{border:1.5px dashed rgba(217,189,134,.6);border-radius:16px;padding:14px;margin:12px 0;font-size:15px}
.fx-archivo input{font:inherit;color:#e9f1ec;max-width:100%}
.fx-carta{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(21px,3vw,26px);line-height:1.5;color:#fff;background:rgba(255,253,247,.07);border:1.5px solid rgba(217,189,134,.5);border-radius:18px;padding:18px 22px;margin:14px 0}
.fx-carta p{margin:0 0 1rem}.fx-carta p:last-child{margin:0}
.fx-sub{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:clamp(24px,4vw,32px);color:#d9bd86;margin:22px 0 8px}
.fx-plan-lista{margin:6px 0 0 20px;display:grid;gap:8px;color:#e9f1ec;font-size:16px}
#fx-acc{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#0b2018 45%)}
#fx-acc .in2{max-width:820px;margin:0 auto;display:flex;gap:10px}
.fx-b{font:700 16px 'Syne',sans-serif;letter-spacing:.03em;border:2px solid #d9bd86;background:transparent;color:#d9bd86;border-radius:999px;padding:13px 22px;cursor:pointer;transition:.2s}
.fx-b:hover:not(:disabled){background:#d9bd86;color:#12332b}
.fx-b.p{background:#d9bd86;color:#12332b;flex:1;font-size:17px;padding:15px 22px}
.fx-b:disabled{opacity:.35;cursor:not-allowed}
.fx-b.suave{border-color:rgba(255,255,255,.3);color:#cfe0d8;padding:13px 16px}
#fx-aviso{font-size:14px;margin-top:10px;color:#ffb4a8}
#fx-hint{max-width:820px;margin:6px auto 0;font:11px 'Space Mono',ui-monospace,monospace;color:#8aa89b;text-align:center;min-height:14px}
@media (prefers-reduced-motion:reduce){.fx-slide{animation:none}}
</style>
</head>
<body>
<header class="hero">
  <svg class="veta" viewBox="0 0 1000 380" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="oroVeta" x1="0" x2="1" y1="0" y2="1">
        <stop offset="0" stop-color="#f1dfae"/><stop offset=".5" stop-color="#c9a45c"/><stop offset="1" stop-color="#f1dfae"/>
      </linearGradient>
    </defs>
    <path d="M-20 300 C 140 250, 210 120, 360 150 S 560 330, 700 200 S 880 40, 1030 90"/>
    <path class="v2" d="M-20 340 C 180 330, 260 230, 420 250 S 640 360, 790 270 S 930 150, 1030 190"/>
  </svg>
  <a class="retorno" href="../panel-estudiante.html">← Mon espace</a>
  <div class="contenido">
    <span class="sello">Mon espace · Français</span>
    <h1>Mes <em>devoirs</em></h1>
    <p class="lead">Les devoirs de chaque séance, au même endroit. Tu les écris ici, tu les rends,
       et ton professeur te répond par un commentaire.</p>
  </div>
</header>

<main class="contenedor">
  <div id="resumen" class="resumen" hidden></div>
  <div id="contenu"><div class="mensaje">Chargement…</div></div>
</main>

<!-- Firma: tarjeta de Miguel Tillero -->
<footer class="firma">
  <p>Profesor de francés · Vive el francés</p>
  <img src="../assets/images/firma-miguel-tillero.jpg" width="420" alt="Miguel Tillero · Especialista del idioma francés">
  <a class="vol" href="../panel-estudiante.html">Volver a mi espacio</a>
</footer>

<!-- Modo inmersivo: se abre desde cada tarjeta -->
<div id="flujo" role="dialog" aria-modal="true" aria-label="Mon devoir">
  <div id="fx-hud"><div id="fx-top"><button id="fx-salir" type="button">✕ Quitter</button><div id="fx-pips"></div></div></div>
  <div id="fx-stage"></div>
  <div id="fx-acc"><div class="in2"><button class="fx-b suave" id="fx-back" type="button">←</button><button class="fx-b p" id="fx-next" type="button">Continuer</button></div><div id="fx-hint"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../assets/js/supabase-config.js?v=1790500000"></script>
<script src="../assets/js/exigir-sesion.js?v=2"></script>
<script src="../assets/js/actividad.js?v=1"></script>
<script>
(function(){
'use strict';
const sb = typeof supabaseClient !== 'undefined' ? supabaseClient : null;
const caja = document.getElementById('contenu');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dia = d => new Date(d + 'T12:00:00');
const fechaLarga = d => dia(d).toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
const palabras = t => (t.trim() ? t.trim().split(/\s+/).length : 0);
let usuario = null, entregas = {}, lista = [];

function mensaje(html){ caja.innerHTML = `<div class="mensaje">${html}</div>`; }

// «Plus que 2 jours», «Demain»… El tono es animar, no apremiar.
function plazo(d, rendu){
  if(!d.entregar_antes || rendu) return '';
  const hoy = new Date(); hoy.setHours(12,0,0,0);
  const n = Math.round((dia(d.entregar_antes) - hoy) / 86400000);
  if(n < 0)  return '<span class="chip plazo">Il est encore temps de le rendre</span>';
  if(n === 0) return '<span class="chip urgente">À rendre aujourd’hui</span>';
  if(n === 1) return '<span class="chip urgente">À rendre demain</span>';
  return `<span class="chip plazo">Plus que ${n} jours</span>`;
}

/* ───────── Estado local de cada deber (borrador, plan, relectura, tiempo) ─────────
   El texto conserva su clave de siempre (mt-deber-<id>) para no perder borradores ya empezados. */
const kT = id => 'mt-deber-' + id, kM = id => 'mt-deber2-' + id;
function leeTexto(d){ const e = entregas[d.id]; try { const b = localStorage.getItem(kT(d.id)); if(b !== null) return b; } catch(x){} return e ? (e.texto || '') : ''; }
function leeMeta(d){ try { return Object.assign({plan:'', checks:[0,0,0,0], seg:0}, JSON.parse(localStorage.getItem(kM(d.id)) || '{}')); } catch(e){ return {plan:'', checks:[0,0,0,0], seg:0}; } }
function guardaMeta(d, m){ try { localStorage.setItem(kM(d.id), JSON.stringify(m)); } catch(e){} }
function hayBorrador(d){ try { return !!(localStorage.getItem(kT(d.id)) || '').trim(); } catch(e){ return false; } }

/* ───────── Listado ───────── */
async function iniciar(){
  if(!sb) return mensaje('No se pudo conectar con la plataforma. Inténtalo más tarde.');
  const { data } = await sb.auth.getSession();
  if(!data || !data.session){
    return mensaje('Para ver y entregar tus deberes, <a href="../login.html">entra con tu cuenta</a>; '
      + 'luego abre «Mes devoirs» desde Materiales.');
  }
  usuario = data.session.user.id;
  const [{ data:ds, error }, { data:es }] = await Promise.all([
    sb.from('deberes').select('*').eq('publicado', true).order('asignado_el', { ascending:false }).order('orden'),
    sb.from('deberes_entregas').select('*').eq('estudiante_id', usuario)
  ]);
  if(error) return mensaje('Todavía no se pueden cargar los deberes. Avísale a tu profesor.');
  entregas = {}; (es || []).forEach(e => { entregas[e.deber_id] = e; });
  lista = ds || [];
  if(!lista.length) return mensaje('Pas de devoirs pour le moment. 🎉');
  pintaLista();
}

function resumen(){
  const ds = lista, hechos = ds.filter(d => entregas[d.id]).length, corr = ds.filter(d => entregas[d.id] && entregas[d.id].estado === 'revisado').length;
  const r = document.getElementById('resumen');
  r.hidden = false;
  r.innerHTML = `<div class="dato pendiente"><b>${ds.length - hechos}</b><span>À rendre</span></div>
    <div class="dato"><b>${hechos}</b><span>Rendus</span></div>
    <div class="dato"><b>${corr}</b><span>Corrigés</span></div>`;
}

function etapas(d){
  const e = entregas[d.id], a = !!e || hayBorrador(d), c = !!e;
  return `<div class="etapas" aria-label="Étapes du devoir">
    <span class="etapa ok"><span class="bola">1</span>Lire</span><span class="linea"></span>
    <span class="etapa ${a ? 'ok' : ''}"><span class="bola">2</span>Écrire</span><span class="linea"></span>
    <span class="etapa ${c ? 'ok' : ''}"><span class="bola">3</span>Rendre</span></div>`;
}

function tarjeta(d){
  const e = entregas[d.id], rendu = !!e;
  const estado = !e ? '<span class="chip">À rendre</span>'
    : e.estado === 'revisado' ? '<span class="chip corrige">Corrigé</span>'
    : '<span class="chip rendu">Rendu le ' + esc(new Date(e.entregado_en).toLocaleDateString('fr-FR', { day:'numeric', month:'long' })) + '</span>';
  const f = dia(d.asignado_el), mes = f.toLocaleDateString('fr-FR', { month:'short' }).replace('.', '');
  const boton = !e ? (hayBorrador(d) ? 'Reprendre mon brouillon' : 'Commencer mon devoir')
    : e.estado === 'revisado' ? 'Lire le mot de mon professeur' : 'Voir mon devoir';
  return `<article class="deber ${rendu ? 'hecho' : ''}" id="d-${d.id}">
    <div class="deber-cab">
      <div class="fecha" aria-hidden="true"><i>${esc(mes)}</i><b>${f.getDate()}</b></div>
      <div>
        <h2>${esc(d.titulo)}</h2>
        <div class="chips">${estado}
          <span class="chip">Séance du ${esc(fechaLarga(d.asignado_el))}</span>
          ${d.entregar_antes ? `<span class="chip">À rendre avant le ${esc(fechaLarga(d.entregar_antes))}</span>` : ''}
          ${plazo(d, rendu)}</div>
      </div>
    </div>
    <div class="deber-cuerpo">
      ${etapas(d)}
      <p class="resumen-corto">${d.palabras ? 'Objectif : environ ' + d.palabras + ' mots.' : 'Un texte clair, en phrases complètes.'}${d.pide_archivo ? ' Avec une image ou une diapositive.' : ''}</p>
      <button class="btn-abrir ${rendu ? 'suave' : ''}" data-abrir="${d.id}">${boton} <span aria-hidden="true">→</span></button>
    </div>
  </article>`;
}

function pintaLista(){
  caja.innerHTML = lista.map(tarjeta).join('');
  caja.querySelectorAll('[data-abrir]').forEach(b => b.addEventListener('click', () => abrir(lista.find(x => x.id === b.dataset.abrir))));
  resumen();
}

/* ───────── Flujo inmersivo ───────── */
const $ = id => document.getElementById(id);
const PASOS = ['Comprendre', 'Préparer', 'Écrire', 'Relire', 'Rendre', 'Bilan'];
const RELECTURA = [
  'J’ai relu mon texte <b>à voix haute</b>.',
  'J’ai vérifié les <b>accords</b> (genre et nombre).',
  'J’ai vérifié mes <b>verbes</b> (temps et terminaisons).',
  'J’ai répondu à <b>toute la consigne</b>.'
];
let D = null, paso = 0, M = null, texto = '', inicio = 0, atras = false, relojEdicion = null, archivo = null;

function abrir(d){
  D = d; M = leeMeta(d); texto = leeTexto(d); archivo = null;
  const e = entregas[d.id];
  paso = e ? 5 : (texto.trim() ? 2 : 0);
  $('flujo').classList.add('on'); document.documentElement.style.overflow = 'hidden';
  render();
}
function cerrar(){
  tickTiempo(); clearTimeout(relojEdicion);
  $('flujo').classList.remove('on'); document.documentElement.style.overflow = '';
  pintaLista();
}
function tickTiempo(){ if(inicio){ M.seg += Math.round((Date.now() - inicio) / 1000); inicio = 0; guardaMeta(D, M); } }

function hud(){
  $('fx-pips').innerHTML = PASOS.map((n, i) => `<div class="fx-pip ${i < paso ? 'done' : ''} ${i === paso ? 'on' : ''}"><i>${i < paso ? '✓' : i + 1}</i><span>${n}</span></div>${i < PASOS.length - 1 ? `<div class="fx-linea ${i < paso ? 'done' : ''}"></div>` : ''}`).join('');
}
function anillo(pct){ const R = 2 * Math.PI * 30; return `<div class="fx-anillo"><svg width="70" height="70"><circle cx="35" cy="35" r="30" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="6"/><circle cx="35" cy="35" r="30" fill="none" stroke="#d9bd86" stroke-width="6" stroke-linecap="round" stroke-dasharray="${R}" stroke-dashoffset="${R * (1 - Math.min(1, pct))}" style="transition:stroke-dashoffset .5s"/></svg><b>${Math.round(Math.min(1, pct) * 100)}%</b></div>`; }

function render(){
  const e = entregas[D.id];
  hud(); tickTiempo(); inicio = (paso === 2) ? Date.now() : 0;
  const el = document.createElement('div'); el.className = 'fx-slide' + (atras ? ' atras' : ''); atras = false;
  let sig = 'Continuer', dis = false, hint = '';
  const n = palabras(texto);
  switch(paso){
    case 0: {
      el.innerHTML = `<div class="fx-in"><div class="fx-lbl">Étape 1 sur 5 · Comprendre</div><h2 class="fx-h">${esc(D.titulo)}</h2>
        <div class="fx-consigna">${D.consigna}</div>
        <div class="fx-chips">${D.palabras ? `<span class="fx-chip">≈ ${D.palabras} mots</span>` : ''}${D.pide_archivo ? '<span class="fx-chip">+ image ou diapositive</span>' : ''}${D.entregar_antes ? `<span class="fx-chip">avant le ${esc(fechaLarga(D.entregar_antes))}</span>` : ''}</div>
        <div class="fx-nota"><b>Ce qu’on attend de toi.</b> Un texte clair, en phrases complètes, qui répond à toute la consigne${D.palabras ? ', d’environ ' + D.palabras + ' mots' : ''}. Tu avances à ton rythme : ton brouillon se garde tout seul.</div>
        ${D.ficha ? `<p class="fx-lead">Pour t’entraîner avant d’écrire : <a href="${esc(D.ficha)}" target="_blank" rel="noopener" style="color:#d9bd86">ouvrir la fiche de la séance ↗</a></p>` : ''}</div>`;
      sig = 'Je prépare mon texte'; break; }
    case 1: {
      el.innerHTML = `<div class="fx-in"><div class="fx-lbl">Étape 2 sur 5 · Préparer</div><h2 class="fx-h">Avant d’écrire, <em>un plan</em></h2>
        <p class="fx-lead">Dos minutos de preparación ahorran muchas correcciones. Responde en notas (no se envían, son solo para ti):</p>
        <ol class="fx-plan-lista"><li>¿Qué quiero decir? (la idea principal)</li><li>¿Qué estructuras o palabras del ciclo puedo usar?</li><li>¿Qué ejemplo personal puedo dar?</li></ol>
        <textarea class="fx-ed fx-plan" id="fx-plan" placeholder="Mes notes…">${esc(M.plan)}</textarea><div class="fx-guardado" id="fx-g">✓ Notes enregistrées</div></div>`;
      sig = 'Je commence à écrire'; break; }
    case 2: {
      const pct = D.palabras ? n / D.palabras : (n ? 1 : 0);
      el.innerHTML = `<div class="fx-in"><div class="fx-lbl">Étape 3 sur 5 · Écrire</div><h2 class="fx-h">À <em>toi</em> d’écrire</h2>
        <textarea class="fx-ed" id="fx-ed" placeholder="Écris ici ton texte…" aria-label="Ton texte">${esc(texto)}</textarea>
        <div class="fx-fila"><div id="fx-ani">${anillo(pct)}</div><span class="fx-cuenta" id="fx-c"></span><span class="fx-guardado" id="fx-g">✓ Brouillon enregistré</span></div>
        <details style="margin-top:12px;color:#cfe0d8;font-size:15px"><summary style="cursor:pointer;color:#d9bd86">Rappel de la consigne</summary><div class="fx-consigna" style="font-size:19px">${D.consigna}</div></details></div>`;
      sig = 'Je relis mon texte'; dis = !n; break; }
    case 3: {
      el.innerHTML = `<div class="fx-in"><div class="fx-lbl">Étape 4 sur 5 · Relire</div><h2 class="fx-h">Relis <em>avant de rendre</em></h2>
        <p class="fx-lead">Une relectura atenta es lo que más mejora un texto. Marca cada punto cuando lo hayas hecho de verdad:</p>
        <ul class="fx-checks">${RELECTURA.map((t, i) => `<li><label class="${M.checks[i] ? 'si' : ''}"><input type="checkbox" data-c="${i}" ${M.checks[i] ? 'checked' : ''}> <span>${t}</span></label></li>`).join('')}</ul>
        <details style="color:#cfe0d8;font-size:15px"><summary style="cursor:pointer;color:#d9bd86">Revoir mon texte (${n} mots)</summary><div class="fx-consigna" style="font-size:20px;white-space:pre-wrap">${esc(texto)}</div></details></div>`;
      sig = 'Je prépare l’envoi'; dis = !M.checks.every(Boolean); hint = dis ? 'Marca los cuatro puntos para continuar' : ''; break; }
    case 4: {
      const min = Math.max(1, Math.round(M.seg / 60));
      el.innerHTML = `<div class="fx-in"><div class="fx-lbl">Étape 5 sur 5 · Rendre</div><h2 class="fx-h">Tout est <em>prêt</em></h2>
        <div class="fx-resumen"><div><b>${n}</b><span>mots</span></div><div><b>${D.palabras ? Math.min(100, Math.round(n * 100 / D.palabras)) + '%' : '✓'}</b><span>${D.palabras ? 'de l’objectif' : 'texte écrit'}</span></div><div><b>${min}′</b><span>d’écriture</span></div></div>
        ${D.pide_archivo ? `<div class="fx-archivo"><div>Image ou diapositive (JPG, PNG, PDF ou PowerPoint, 10 Mo max.)</div><input type="file" id="fx-file" accept="image/*,.pdf,.pptx"><div id="fx-fa" style="margin-top:6px;color:#d9bd86">${e && e.archivo ? 'Déjà envoyé : <b>' + esc(e.archivo_nombre || 'fichier') + '</b>' : ''}</div></div>` : ''}
        <div class="fx-nota"><b>Quand tu rends,</b> ton professeur reçoit ton texte et te répond par un commentaire. Tu pourras le retravailler ensuite si tu veux.</div>
        <div id="fx-aviso"></div></div>`;
      sig = e ? 'Rendre à nouveau' : 'Rendre mon devoir'; break; }
    case 5: {
      const min = Math.max(1, Math.round(M.seg / 60)), pct = D.palabras ? n / D.palabras : 1;
      const corr = e && e.estado === 'revisado' && e.comentario;
      el.innerHTML = `<div class="fx-in"><div class="fx-lbl">Bilan</div><h2 class="fx-h">${corr ? 'Le mot de <em>ton professeur</em>' : 'C’est <em>rendu</em>'}</h2>
        ${corr ? `<div class="fx-carta">${esc(e.comentario).split(/\n{2,}|\n/).map(p => '<p>' + p + '</p>').join('')}</div>` : `<p class="fx-lead">Merci. Ton professeur le lira et te répondra. En attendant, voici où tu en es.</p>`}
        <div class="fx-fila">${anillo(pct)}<span class="fx-cuenta"><b style="color:#fff">${n} mots</b>${D.palabras ? ' sur ' + D.palabras + ' d’objectif' : ''} · ${min} min d’écriture · relecture ${M.checks.every(Boolean) ? 'complète' : 'à faire'}</span></div>
        <div class="fx-sub">Où aller ensuite</div>
        <ol class="fx-plan-lista">
          ${D.ficha ? `<li>Entraîne-toi avec <a href="${esc(D.ficha)}" target="_blank" rel="noopener" style="color:#d9bd86">la fiche de la séance ↗</a> : c’est ce qui consolide ce que tu viens d’écrire.</li>` : '<li>Relis ton texte dans un jour, avec des yeux frais : tu verras des choses que tu n’as pas vues aujourd’hui.</li>'}
          <li>${corr ? 'Relis le commentaire de ton professeur et choisis <b>un seul point</b> à améliorer dans ton prochain texte.' : 'Attends le commentaire de ton professeur : il te dira ce qui marche et ce qu’il faut travailler.'}</li>
          <li>Garde <b>une question</b> sur ce qui t’a le plus coûté : on la résout ensemble en classe.</li></ol></div>`;
      sig = 'Retour à mes devoirs'; break; }
  }
  $('fx-stage').innerHTML = ''; $('fx-stage').appendChild(el); el.scrollTop = 0;
  $('fx-next').textContent = sig; $('fx-next').disabled = dis; $('fx-hint').textContent = hint;
  $('fx-back').style.visibility = (paso > 0 && !(paso === 5)) || (paso === 5 && !!entregas[D.id]) ? 'visible' : 'hidden';
  $('fx-back').textContent = paso === 5 ? '✎ Retravailler' : '←';
  if(paso === 1) ligaPlan(el);
  if(paso === 2) ligaEditor(el);
  if(paso === 3) el.querySelectorAll('[data-c]').forEach(c => c.addEventListener('change', () => {
    M.checks[+c.dataset.c] = c.checked ? 1 : 0; guardaMeta(D, M); c.closest('label').classList.toggle('si', c.checked);
    const ok = M.checks.every(Boolean); $('fx-next').disabled = !ok; $('fx-hint').textContent = ok ? '' : 'Marca los cuatro puntos para continuar'; }));
}
function destello(){ const g = $('fx-g'); if(!g) return; g.classList.add('on'); clearTimeout(relojEdicion); relojEdicion = setTimeout(() => g.classList.remove('on'), 1600); }
function ligaPlan(el){ const t = el.querySelector('#fx-plan'); t.addEventListener('input', () => { M.plan = t.value; guardaMeta(D, M); destello(); }); setTimeout(() => t.focus({preventScroll:true}), 400); }
function ligaEditor(el){
  const t = el.querySelector('#fx-ed'), c = el.querySelector('#fx-c');
  const cuenta = () => { const n = palabras(t.value); texto = t.value;
    c.textContent = n + ' mot' + (n > 1 ? 's' : '') + (D.palabras ? ' · objectif : ' + D.palabras : '');
    $('fx-ani').innerHTML = anillo(D.palabras ? n / D.palabras : (n ? 1 : 0)); $('fx-next').disabled = !n; };
  t.addEventListener('input', () => { cuenta(); try { localStorage.setItem(kT(D.id), t.value); } catch(e){} destello(); });
  cuenta(); setTimeout(() => t.focus({preventScroll:true}), 400);
}

async function rendre(){
  const btn = $('fx-next'), av = $('fx-aviso'), inp = $('fx-file'), f = inp && inp.files[0];
  av.textContent = '';
  if(!texto.trim() && !f){ av.textContent = 'Écris ton texte avant de rendre le devoir.'; return; }
  if(D.pide_archivo && !f && !(entregas[D.id] && entregas[D.id].archivo)){
    if(!confirm('Ce devoir demande une image ou une diapositive. Rendre seulement le texte ?')) return;
  }
  if(f && f.size > 10 * 1024 * 1024){ av.textContent = 'Le fichier dépasse 10 Mo.'; return; }
  btn.disabled = true; btn.textContent = 'Envoi…';
  let ruta = null, nombre = null;
  if(f){
    const ext = (f.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '');
    ruta = `${usuario}/${D.id}/${Date.now()}.${ext}`; nombre = f.name;
    const up = await sb.storage.from('deberes').upload(ruta, f, { contentType: f.type || undefined, upsert: true });
    if(up.error){ btn.disabled = false; btn.textContent = 'Rendre mon devoir'; av.textContent = 'Le fichier n’a pas pu être envoyé : ' + up.error.message; return; }
  }
  const { data, error } = await sb.rpc('entregar_deber', { p_deber: D.id, p_texto: texto, p_archivo: ruta, p_archivo_nombre: nombre });
  if(error){ btn.disabled = false; btn.textContent = 'Rendre mon devoir'; av.textContent = 'Pas envoyé : ' + error.message; return; }
  entregas[D.id] = data;
  try { localStorage.removeItem(kT(D.id)); } catch(e){}
  paso = 5; render();
}

$('fx-next').addEventListener('click', () => {
  if(paso === 4){ rendre(); return; }
  if(paso === 5){ cerrar(); return; }
  paso++; render();
});
$('fx-back').addEventListener('click', () => {
  if(paso === 5){ paso = 2; texto = leeTexto(D); render(); return; }
  if(paso > 0){ paso--; atras = true; render(); }
});
$('fx-salir').addEventListener('click', cerrar);
addEventListener('keydown', e => { if(!$('flujo').classList.contains('on')) return; if(e.key === 'Escape') cerrar(); });

iniciar();
})();
</script>
</body>
</html>
