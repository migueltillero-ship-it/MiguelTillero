<title>Révision autonome · B2 · Vive el francés</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Space+Mono&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Revisión autónoma del B2 · experiencia inmersiva, una pantalla por idea.
   Decisiones de diseño y su apoyo en la investigación sobre aprendizaje con tecnología:
   · Una sola idea por pantalla y avance al ritmo del estudiante (segmentación, Mayer); color por familia de contenido
     (señalización) y nada decorativo que compita con la tarea (coherencia).
   · Primero se produce la respuesta y después se ve la corrección (práctica de recuperación). Lo fallado vuelve al final
     (repaso espaciado dentro de la sesión): la puntuación honesta es la del primer intento, la «maîtrise» cuenta lo aprendido.
   · La corrección explica el porqué (retroalimentación de proceso, Hattie y Timperley), nunca juzga a la persona.
   · Siempre se ve adónde se va, cómo se va y qué sigue (cabecera con etapas, barra de progreso, pantalla de objetivo por etapa).
   · Los puntos y las barras motivan, no enseñan: por eso son sobrios y no hay clasificaciones entre estudiantes.
   · Autonomía (se elige el tema de escritura, el bonus es opcional), competencia (maîtrise visible) y cercanía (mensaje del profesor).
   Al final, «Envoyer mes résultats» guarda el trabajo en la plataforma (rpc enviar_revision_autonoma). */
:root{--noche:#12332b;--bosque:#1f6b55;--oro:#a5824a;--oroC:#d9bd86;--crema:#f3eee2;--ok:#8fd3b6;--ko:#e8a0b4;
  --g:#6aa9e0;--l:#e8b23a;--s:#e07a9a;--x:#d9bd86;
  --display:'Cormorant Garamond',Georgia,serif;--sans:'Syne',Arial,sans-serif;--mono:'Space Mono',ui-monospace,monospace;--c:var(--oroC)}
*{box-sizing:border-box;margin:0;padding:0;font-variant-numeric:lining-nums;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b2018;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--sans);color:var(--crema);line-height:1.5;font-size:17px;
  background:radial-gradient(circle at 85% 0%,#1f6b55 0%,#12332b 55%,#0b2018 100%)}
.fl{position:fixed;font-family:var(--display);font-style:italic;color:#fff;opacity:.045;white-space:nowrap;pointer-events:none;animation:flota var(--d,22s) ease-in-out infinite alternate}
@keyframes flota{from{transform:translate(0,0) rotate(-3deg)}to{transform:translate(30px,-40px) rotate(4deg)}}
/* cabecera: etapas + progreso */
#hud{position:fixed;left:0;right:0;top:0;z-index:5;padding:calc(10px + env(safe-area-inset-top)) 16px 0;background:linear-gradient(#0b2018 40%,transparent)}
#pips{display:flex;align-items:center;max-width:860px;margin:0 auto;gap:0}
.pip{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#6f8f82;flex:none}
.pip i{width:26px;height:26px;border-radius:50%;border:2px solid #3f6556;display:grid;place-items:center;font-style:normal;font-size:12px;transition:all .5s}
.pip.on{color:var(--oroC)}.pip.on i{border-color:var(--oroC);background:rgba(217,189,134,.15)}
.pip.done i{background:var(--oroC);border-color:var(--oroC);color:#12332b}.pip.done{color:#bfd6cc}
.pipline{flex:1;height:2px;background:#2d5143;margin:0 8px;position:relative;overflow:hidden;min-width:8px}
.pipline b{position:absolute;inset:0;background:var(--oroC);transform-origin:left;transform:scaleX(0);transition:transform .6s}
.pipline.done b{transform:scaleX(1)}
@media (max-width:640px){.pip span{display:none}}
#barra{max-width:860px;margin:10px auto 0;display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:12px;color:var(--oroC)}
#barra .tr{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
#barra .tr i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--oro),var(--oroC));border-radius:99px;transition:width .7s cubic-bezier(.2,.85,.2,1)}
#serie{display:none;color:#12332b;background:var(--oroC);border-radius:99px;padding:2px 10px;font-weight:700}
#serie.on{display:inline-block;animation:pop .5s}
/* pantallas */
#stage{position:fixed;inset:0;padding:calc(92px + env(safe-area-inset-top)) 0 calc(86px + env(safe-area-inset-bottom));overflow:hidden}
.slide{height:100%;overflow-y:auto;overflow-x:hidden;padding:12px 20px 24px;animation:entra .55s cubic-bezier(.2,.85,.2,1) both}
.slide.back{animation-name:entraAtras}
@keyframes entra{from{opacity:0;transform:translateX(7%)}to{opacity:1;transform:none}}
@keyframes entraAtras{from{opacity:0;transform:translateX(-7%)}to{opacity:1;transform:none}}
.in{max-width:860px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center}
.lbl{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--c)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,10vw,92px);line-height:.98;letter-spacing:-.01em;margin:10px 0}
h1 em{font-style:italic;color:var(--oroC)}
h2{font-family:var(--display);font-weight:500;font-size:clamp(34px,6.5vw,60px);line-height:1.02;margin:8px 0 14px}
h2 em{font-style:italic;color:var(--c)}
.lead{font-size:clamp(16px,2.2vw,20px);color:#cfe0d8;max-width:62ch}
.shimmer{background:linear-gradient(100deg,var(--oroC) 20%,#fff7dd 45%,var(--oroC) 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brilla 4s linear infinite}
@keyframes brilla{from{background-position:120% 0}to{background-position:-120% 0}}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.nota{border-left:4px solid var(--oroC);background:rgba(217,189,134,.1);border-radius:12px;padding:12px 16px;margin:16px 0;font-size:16px;max-width:62ch}
.nota b{color:var(--oroC)}
.msgprof{font-family:var(--display);font-style:italic;font-size:clamp(20px,3vw,27px);line-height:1.3;color:var(--oroC);margin:18px 0 4px;max-width:34ch}
/* mapa de la misión */
.mapa{list-style:none;margin:18px 0;display:grid;gap:12px}
.mapa li{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;padding:14px 16px;border-radius:20px;border:1.5px solid rgba(217,189,134,.3);background:rgba(255,255,255,.05);opacity:0;animation:entra .6s both}
.mapa li:nth-child(2){animation-delay:.12s}.mapa li:nth-child(3){animation-delay:.24s}.mapa li:nth-child(4){animation-delay:.36s}.mapa li:nth-child(5){animation-delay:.48s}
.mapa .n{width:48px;height:48px;border-radius:50%;background:var(--oroC);color:#12332b;font-family:var(--mono);font-weight:700;display:grid;place-items:center;font-size:18px}
.mapa h3{font-family:var(--display);font-size:28px;line-height:1;font-weight:600}
.mapa p{font-size:14px;color:#bfd6cc}.mapa .t{font-family:var(--mono);font-size:12px;color:var(--oroC)}
/* rappel */
.reglas{display:grid;gap:12px;margin-top:14px}
.regla{border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent);background:rgba(255,255,255,.06);border-radius:20px;padding:14px 18px;animation:entra .6s both}
.regla h3{font-family:var(--display);font-size:clamp(24px,4vw,34px);color:var(--c);font-weight:600;line-height:1.05}
.regla p{font-size:clamp(15px,2vw,18px);color:#e9f1ec;margin-top:4px}.regla p b{color:#fff}
.regla .ex{font-family:var(--display);font-style:italic;font-size:clamp(20px,3vw,26px);color:var(--oroC);margin-top:4px}
/* preguntas */
.meta{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--c);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.meta .pt{background:var(--c);color:#12332b;border-radius:99px;padding:2px 10px;font-weight:700}
.q{font-family:var(--display);font-weight:500;font-size:clamp(26px,4.6vw,50px);line-height:1.2;color:#fff;margin:14px 0 8px}
.q i{color:var(--c)}.q small{font-size:.62em;color:#cfe0d8;font-style:normal;font-family:var(--sans)}
.q ul{list-style:none;margin-top:6px}.q li{margin:10px 0;font-size:.78em}
.q .blk{display:inline-block;vertical-align:baseline;min-width:5.5ch;width:var(--w,9ch);font:inherit;font-style:italic;color:var(--c);background:transparent;border:0;border-bottom:3px solid var(--c);outline:none;padding:0 4px;margin:0 4px;text-align:center;border-radius:0}
.q .blk::placeholder{color:rgba(255,255,255,.22)}
.q .blk:focus{border-bottom-color:#fff;background:rgba(255,255,255,.06)}
.seg{display:inline-flex;gap:6px;vertical-align:middle;margin:2px 4px;flex-wrap:wrap}
.seg button{font:600 .5em var(--sans);color:#e9f1ec;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);border-radius:99px;padding:6px 16px;cursor:pointer;transition:all .2s}
.seg button.on{background:var(--c);border-color:var(--c);color:#12332b}
.seg.bloq button{pointer-events:none}
.larga{width:100%;min-height:130px;font:500 clamp(20px,3vw,26px)/1.35 var(--display);color:#fff;background:rgba(0,0,0,.25);border:1.5px solid rgba(255,255,255,.28);border-radius:16px;padding:12px 14px;outline:none;resize:vertical}
.larga:focus{border-color:var(--oroC)}
.fb{margin-top:16px;border-radius:20px;padding:16px 18px;border:1.5px solid;animation:pop .5s both;max-width:62ch}
.fb.ok{border-color:var(--ok);background:rgba(143,211,182,.1)}.fb.ko{border-color:var(--ko);background:rgba(232,160,180,.09)}
.fb .t{font-family:var(--display);font-size:30px;line-height:1;font-weight:600}.fb.ok .t{color:var(--ok)}.fb.ko .t{color:var(--ko)}
.fb .r{font-family:var(--display);font-style:italic;font-size:clamp(22px,3.4vw,30px);color:var(--oroC);margin:8px 0 2px}
.fb .w{font-size:15.5px;color:#d8e8e0}
.fb .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
/* lectura */
.texto{font-family:var(--display);font-size:clamp(21px,3.2vw,30px);line-height:1.4;color:#fff;background:rgba(0,0,0,.22);border-radius:20px;padding:18px 20px;margin:14px 0;transition:filter 1.2s,opacity 1.2s}
.texto b{color:var(--oroC)}.texto.oculto{filter:blur(14px);opacity:.15;user-select:none}
.reloj{display:flex;align-items:center;gap:14px}
.anillo{width:84px;height:84px;position:relative;flex:none}
.anillo svg{transform:rotate(-90deg)}.anillo b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:20px;color:var(--oroC)}
.anillo.low b{color:#ffb4a8}
/* escritura */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chip{font-family:var(--mono);font-size:13px;border:1.5px solid rgba(255,255,255,.3);border-radius:99px;padding:4px 12px;color:#bfd6cc;transition:all .3s}.chip.on{background:var(--ok);border-color:var(--ok);color:#12332b;transform:scale(1.06)}
.temas{display:grid;gap:10px;margin:10px 0}.tema{font:500 clamp(17px,2.4vw,21px)/1.3 var(--sans);text-align:left;color:#fff;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.25);border-radius:16px;padding:12px 16px;cursor:pointer}
.tema.on{border-color:var(--oroC);background:rgba(217,189,134,.14)}
.cont{font-family:var(--mono);font-size:13px;color:var(--oroC);margin-top:6px}
.ayuda{font-size:15px;color:#cfe0d8;margin-top:8px}.ayuda summary{cursor:pointer;color:var(--oroC)}.ayuda li{margin:4px 0 4px 18px}
/* bilan */
.bilan{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;margin:14px 0}
@media (max-width:560px){.bilan{grid-template-columns:1fr;justify-items:center}}
.aro{width:150px;height:150px;position:relative}.aro svg{transform:rotate(-90deg)}.aro b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:46px;color:var(--oroC)}
.barras{display:grid;gap:10px;width:100%}.barras div{font-size:14px}.barras .tr{height:10px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:4px}.barras .tr i{display:block;height:100%;border-radius:99px;background:var(--c);width:0;transition:width 1.2s cubic-bezier(.2,.85,.2,1)}
.sig{display:grid;gap:8px;margin-top:8px}.sig li{list-style:none;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.06);font-size:15px}.sig b{color:var(--oroC)}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.conf i{position:absolute;top:-20px;width:9px;height:14px;background:var(--oroC);border-radius:2px;animation:cae var(--t,3s) linear forwards}
@keyframes cae{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
.sub{font-family:var(--display);font-weight:600;font-size:clamp(26px,4vw,34px);color:var(--oroC);margin:26px 0 8px}
.plan{margin:6px 0 0 20px;display:grid;gap:8px;color:#e9f1ec}.plan li{font-size:15.5px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
/* barra de acción */
#acc{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#0b2018 45%);}
#acc .in2{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:center}
.btn{font:700 16px var(--sans);letter-spacing:.03em;border:2px solid var(--oroC);background:transparent;color:var(--oroC);border-radius:999px;padding:13px 22px;cursor:pointer;transition:all .2s}
.btn:hover:not(:disabled){background:var(--oroC);color:#12332b}
.btn.p{background:var(--oroC);color:#12332b;flex:1;font-size:17px;padding:15px 22px}
.btn.p:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.suave{border-color:rgba(255,255,255,.3);color:#cfe0d8;padding:13px 16px}
#hint{font-family:var(--mono);font-size:11px;color:#8aa89b;text-align:center;margin-top:6px;min-height:14px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

<script>
'use strict';
const $=id=>document.getElementById(id);
const C={g:'#6aa9e0',l:'#e8b23a',s:'#e07a9a',x:'#d9bd86'};
const TH={g:'Grammaire',l:'Lexique',s:'Savoir-faire',x:'Échauffement'};
const sb=typeof supabaseClient!=='undefined'?supabaseClient:null;

/* ───────── Contenido ───────── */
const RAPPEL={
 g:{t:'Grammaire',c:'g',reglas:[
  ['ce qui · ce que · ce dont','<b>ce qui</b> = sujeto · <b>ce que</b> = objeto directo · <b>ce dont</b> = verbo + de.','« Ce dont j’ai besoin, c’est de temps. »'],
  ['mieux ≠ meilleur','<b>meilleur</b> = adjetivo (de <i>bon</i>) · <b>mieux</b> = adverbio (de <i>bien</i>).','« Il cuisine mieux que moi. »'],

  ['tellement','Intensidad, cantidad, consecuencia: <b>tellement de… que…</b>','« Il y avait tellement de bruit que… »'],

 l:{t:'Lexique',c:'l',reglas:[
  ['goût · valoir','<b>avoir bon / mauvais goût</b> · <b>des goûts et des couleurs…</b> · <b>valoir la peine = valoir le coup</b> · <b>mieux vaut… que…</b>','« Mieux vaut tard que jamais. »'],
  ['Saveurs et textures','<b>acide, amer, sucré, salé, épicé</b> · <b>croustillant, croquant, fondant, onctueux, moelleux</b>','« Une crème onctueuse. »'],
  ['Décrire un style','<b>chic, élégant, soigné, décontracté, négligé</b> · une tenue, un look.','« Elle a un style très soigné. »'],
  ['Les manières','<b>Ça se fait / ça ne se fait pas</b> · bonnes et mauvaises manières.','« Ça ne se fait pas de couper la parole. »'],
  ['Stéréotypes et vie','Un <b>stéréotype</b> = una idea hecha · <b>attendre un enfant</b> = être enceinte.','« Ma voisine attend un enfant. »']]},
 s:{t:'Savoir-faire',c:'s',reglas:[
  ['Prendre des notes (méthode DELF)','Se anota lo <b>esencial</b>: palabras clave, cifras, abreviaturas (<b>p. ex.</b>, <b>c.-à-d.</b>, →, +/–). Nunca frases completas.',''],
  ['Nuancer un désaccord','<b>Je ne suis pas tout à fait d’accord, mais…</b> · <b>Certes… cependant…</b> · <b>Je comprends ton point de vue, pourtant…</b>',''],
  ['Fait ou opinion ?','Un <b>hecho</b> se verifica (cifra, fecha). Una <b>opinión</b> expresa un juicio: <i>le plus beau, je trouve que…</i>',''],
  ['Défendre un point de vue','Una idea · un <b>argumento</b> · un <b>ejemplo</b>. Se termina con <b>Ce qui compte, c’est…</b>','']]}
};
const VF=['Vrai','Faux'];
const T=(...ok)=>({k:'t',ok});const CH=(ok,opts=VF)=>({k:'c',opts,ok});const RE=re=>({k:'t',re});
/* ch: ech/quiz (cuentan en el quiz) · boss (bonus). inputs: se corrigen solos; «long» se autoevalúa. */
const Q=[
 {id:'e1',ch:'quiz',th:'x',p:1,q:'Vrai ou faux ?<br>« Ce que me plaît dans ce film, c’est l’humour. » {0}',in:[CH('Faux')],a:'Faux — ce qui',w:'« plaire » a besoin d’un sujet : on dit <b>ce qui</b> me plaît.'},
 {id:'e2',ch:'quiz',th:'x',p:1,q:'Vrai ou faux ?<br>« Ce dont j’ai peur, c’est de l’avion. » {0}',in:[CH('Vrai')],a:'Vrai',w:'« avoir peur DE » : <b>ce dont</b>.'},
 {id:'e3',ch:'quiz',th:'x',p:1,q:'Vrai ou faux ?<br>« Il chante meilleur que moi. » {0}',in:[CH('Faux')],a:'Faux — mieux',w:'<b>meilleur</b> = adjetivo (bon) · <b>mieux</b> = adverbio (bien). Se canta « bien », por tanto <b>mieux</b>.'},
 {id:'e4',ch:'quiz',th:'x',p:1,q:'Vrai ou faux ?<br>« Pourvu qu’il fait beau demain ! » {0}',in:[CH('Faux')],a:'Faux — fasse',w:'<b>Pourvu que</b> + subjonctif : « qu’il <b>fasse</b> beau ».'},
 {id:'e5',ch:'quiz',th:'x',p:1,q:'Vrai ou faux ?<br>« Je marche plutôt que de prendre le bus. » {0}',in:[CH('Vrai')],a:'Vrai',w:'<b>plutôt que de</b> + infinitif.'},
 {id:'q1',ch:'quiz',th:'g',p:1,q:'« Je ne comprends pas {0} te plaît dans ce film. »',in:[T('ce qui')],a:'ce qui',w:'« plaît » necesita un sujeto: <b>ce qui</b> lo reemplaza.'},
 {id:'q2',ch:'quiz',th:'g',p:1,q:'« {0} j’ai besoin, c’est de calme. »',in:[T('ce dont')],a:'Ce dont',w:'« avoir besoin DE » : <b>ce dont</b> reemplaza el complemento con <i>de</i>.'},

    const ya=S.lectOk;
    el.innerHTML=`<div class="in" style="--c:${C.l}"><div class="lbl" style="color:${C.l}">Lecture éclair · 1 / 2</div><h2>Lis, <em>puis retiens</em></h2>
      <div class="reloj"><div class="anillo" id="ani"><svg width="84" height="84"><circle cx="42" cy="42" r="36" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="6"/><circle id="arc" cx="42" cy="42" r="36" fill="none" stroke="#d9bd86" stroke-width="6" stroke-linecap="round" stroke-dasharray="226" stroke-dashoffset="0"/></svg><b id="tt">1:30</b></div><p class="lead" id="lh">${ya?'Tu as déjà lu le texte. Passe aux questions.':'Pulsa «Commencer la lecture» : tienes 90 segundos. Anota lo esencial en el cuaderno de abajo.'}</p></div>
      <div class="texto ${ya?'oculto':'oculto'}" id="tx">${LECTURA}</div>
      <textarea class="larga" id="notas" placeholder="Tes notes (mots-clés, chiffres…)" ${ya?'readonly':''}>${esc(S.notas||'')}</textarea></div>`;
    nxt=ya?'Voir les questions':'Commencer la lecture';dis=false;ctx.lread=1;break}
   case 'lq':{
    const [pq,rep]=LQ[sl.i], hecho=S.lect[sl.i];
    el.innerHTML=`<div class="in" style="--c:${C.l}"><div class="lbl" style="color:${C.l}">Lecture éclair · question ${sl.i+1} / 4</div><div class="q">${pq}</div>
      <textarea class="larga" id="lqa" placeholder="De mémoire, sans regarder le texte…" ${hecho?'readonly':''}>${esc(S.vals['lq'+sl.i]||'')}</textarea>
      <div id="fbx">${hecho?`<div class="fb ok"><div class="t">Compare</div><div class="r">${rep}</div><div class="w">Si tu l’avais retenu, ¡bien! Si no, ahora ya lo sabes.</div></div>`:''}</div></div>`;
    nxt=hecho?(sl.i<3?'Question suivante':'Continuer'):'Voir la réponse';break}
   case 'write':{
    const w=(S.texto.trim().match(/\S+/g)||[]).length, low=S.texto.toLowerCase();
    const out=['ce qui','ce que','ce dont','plutôt que','pourvu que','tellement'];
    el.innerHTML=`<div class="in" style="--c:${C.s}"><div class="lbl" style="color:${C.s}">Écriture · à toi de parler</div><h2>Ton <em>texte</em></h2>
      <div class="temas">${Object.entries(TEMAS).map(([k,v])=>`<button class="tema ${S.tema===k?'on':''}" data-t="${k}">${v}</button>`).join('')}</div>
      <p class="lead" style="font-size:15px">Usa <b>al menos dos</b> estructuras (se iluminan al escribirlas) y llega a <b>40 palabras</b>.</p>
      <div class="chips" id="chips">${out.map(o=>`<span class="chip ${low.includes(o)?'on':''}" data-r="${o}">${o}</span>`).join('')}</div>
      <textarea class="larga" id="texte" style="min-height:190px" placeholder="Écris ici…">${esc(S.texto)}</textarea>
      <div class="cont" id="cont"></div>
      <details class="ayuda"><summary>¿Necesitas ayuda para empezar?</summary><ul><li>« Ce que j’aime, c’est… »</li><li>« Je préfère… plutôt que de… »</li><li>« C’est tellement… que… »</li><li>« Pourvu que… »</li></ul></details></div>`;
    ctx.write=1;break}
   case 'bonus':{
    el.innerHTML=`<div class="in" style="--c:${C.x}"><div class="lbl">Bonus · optionnel</div><h2>Boss <em class="shimmer">final</em></h2><p class="lead">Ocho preguntas más, para quien quiere ir más lejos. <b>Es opcional</b>: tus puntos se guardan aparte y no son necesarios para terminar.</p>
      <div class="nota"><b>Tu elección.</b> Puedes hacer el bonus ahora o ir directo a ver tu bilan.</div></div>`;
    nxt='Je fais le bonus';ctx.bonus=1;break}
   case 'bilan':{
    const qp=ptsPrimero(QUIZ_IDS), bp=ptsPrimero(BOSS_IDS), pc=Math.round(100*qp/QUIZ_TOT), dom=dominados();
    const porT=t=>{const ids=QUIZ_IDS.filter(i=>QBY[i].th===t||(t==='g'&&QBY[i].th==='x'));const ok=ids.filter(i=>resultado(i)==='ok').length;return[ok,ids.length]};
    const ths=['g','l','s'].map(t=>[t,...porT(t)]);
    const flojos=ths.filter(x=>x[2]&&x[1]/x[2]<.7);
    const conceptos=Object.entries(CONC).map(([k,c])=>{const ids=c.q.filter(i=>S.res[i]);const mal=ids.filter(i=>resultado(i)==='ko');return {k,c,ids,mal}}).filter(x=>x.ids.length);
    const dom_c=conceptos.filter(x=>!x.mal.length), rev_c=conceptos.filter(x=>x.mal.length).sort((a,b)=>b.mal.length-a.mal.length);
    const usadas=['ce qui','ce que','ce dont','plutôt que','pourvu que','tellement'].filter(o=>S.texto.toLowerCase().includes(o));
    const faltan=['ce qui','ce que','ce dont','plutôt que','pourvu que','tellement'].filter(o=>!usadas.includes(o));
    const w=(S.texto.trim().match(/\S+/g)||[]).length;
    const R=2*Math.PI*66;
    el.innerHTML=`<div class="in"><div class="lbl">Étape 5 · Ton bilan</div><h2>Voilà <em class="shimmer">où tu en es</em></h2>
     <div class="bilan"><div class="aro"><svg width="150" height="150"><circle cx="75" cy="75" r="66" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="10"/><circle id="arb" cx="75" cy="75" r="66" fill="none" stroke="#d9bd86" stroke-width="10" stroke-linecap="round" stroke-dasharray="${R}" stroke-dashoffset="${R}" style="transition:stroke-dashoffset 1.4s cubic-bezier(.2,.85,.2,1)"/></svg><b>${pc}%</b></div>
      <div class="barras">${ths.map(x=>`<div style="--c:${C[x[0]]}">${TH[x[0]]} · ${x[1]}/${x[2]} au premier essai<div class="tr"><i data-w="${x[2]?Math.round(100*x[1]/x[2]):0}"></i></div></div>`).join('')}</div></div>
     <ul class="sig"><li>Premier essai : <b>${qp}/${QUIZ_TOT} points</b> · maîtrise après rattrapage : <b>${dom}/${QUIZ_IDS.length}</b>.</li>
      <li>Texte écrit : <b>${w} mots</b>${S.bonus?` · bonus : <b>${bp}/${BOSS_TOT}</b>`:''}.</li>
      </ul>
     <h3 class="sub">Ce que tu maîtrises</h3>
     ${dom_c.length?`<div class="chips">${dom_c.map(x=>`<span class="chip on">${x.c.n}</span>`).join('')}</div>`:'<p class="lead" style="font-size:15px">Todavía no hay un tema que hayas acertado por completo al primer intento: es normal, y por eso hay un plan abajo.</p>'}
     <h3 class="sub">À revoir en priorité</h3>
     ${rev_c.length?rev_c.slice(0,4).map(x=>{const R=RAPPEL[x.c.r[0]].reglas[x.c.r[1]];return `<div class="regla" style="--c:${C[RAPPEL[x.c.r[0]].c]}"><h3>${x.c.n}</h3><p>${R[1]}</p>${R[2]?`<div class="ex">${R[2]}</div>`:''}<p style="margin-top:8px"><b style="color:var(--oroC)">Cómo entrenarlo:</b> ${x.c.tip}</p></div>`}).join(''):'<div class="nota"><b>Nada urgente.</b> Acertaste todo al primer intento. Pasa a usar estas estructuras al hablar y escribir.</div>'}
     <h3 class="sub">Ton texte</h3>
     <p class="lead" style="font-size:15.5px">Usaste <b>${usadas.length}</b> de las 6 estructuras${usadas.length?' ('+usadas.join(', ')+')':''}.${faltan.length?' En tu próximo texto, prueba también <b>'+faltan.slice(0,2).join('</b> y <b>')+'</b>.':' ¡Las usaste todas!'}</p>
     <h3 class="sub">Ton plan pour cette semaine</h3>
     <ol class="plan">
      <li>${rev_c.length?'Relee la regla de <b>'+rev_c[0].c.n+'</b> y haz el ejercicio de entrenamiento de arriba.':'Elige una estructura del ciclo y úsala en tres frases tuyas.'}</li>
      <li>Haz las fichas del <a href="espace-b2-exercices.html" style="color:var(--oroC)">espacio de ejercicios B2</a>: son 10 minutos y cuentan para tu avance.</li>
      <li>Antes de la próxima clase, prepara <b>una pregunta</b> sobre lo que más te costó: la resolvemos juntos.</li>
     </ol>
     <div class="nota" id="msgb">Más abajo tienes tu balance y lo que te recomiendo revisar. Cuando termines de leerlo, pulsa <b>Envoyer mes résultats</b> para guardarlo en la plataforma; puedes reenviarlo si mejoras algo.</div></div>`;
    nxt=S.enviado?'Renvoyer mes résultats':'Envoyer mes résultats';ctx.bilan=1;break}
   case 'fin':{
    el.innerHTML=`<div class="in"><div class="lbl">Terminé</div><h1>Merci${nombre?', <em class="shimmer">'+esc(nombre.split(' ')[0])+'</em>':''} !</h1>
      <p class="lead">Tu trabajo est <b>enregistré dans la plateforme</b>. Lo veré, leeré tu texto y completaré tu nota.</p>
      <p class="msgprof">« Beau travail. On se retrouve en classe pour continuer ensemble. »</p><p class="lbl">— Miguel</p></div>`;
    nxt='Revoir mon bilan et mes recommandations';ctx.fin=1;break}
  }
  $('stage').innerHTML='';$('stage').appendChild(el);el.scrollTop=0;
  $('next').textContent=nxt;$('next').disabled=dis;$('back').style.visibility=back?'visible':'hidden';$('hint').textContent=hint;
  document.body.dataset.t=sl.t;
  if(ctx.write)bindWrite(el);
  if(sl.t==='q')bindQ(el,sl);
  if(sl.t==='lread')bindLread(el);
  if(sl.t==='lq'){const t=el.querySelector('#lqa');if(t&&!S.lect[sl.i])setTimeout(()=>t.focus(),400)}
  if(sl.t==='bilan')setTimeout(()=>{const a=$('arb');if(a)a.style.strokeDashoffset=2*Math.PI*66*(1-ptsPrimero(QUIZ_IDS)/QUIZ_TOT);document.querySelectorAll('.barras i').forEach(i=>i.style.width=i.dataset.w+'%')},250);
  if(sl.t==='fin')confeti();
  gateNext(sl,el);
}

/* ───────── Interacciones ───────── */
function bindQ(el,sl){
  const q=QBY[sl.id];const hecho=sl.retry?S.retry[sl.id]:resultado(sl.id);
  el.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{if(hecho)return;const g=b.parentElement;g.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');gateNext(sl,el)}));
  el.querySelectorAll('.blk,.larga').forEach(i=>i.addEventListener('input',()=>gateNext(sl,el)));
  const f=el.querySelector('.blk,.larga');if(f&&!hecho)setTimeout(()=>f.focus({preventScroll:true}),450);
}
function valores(el){const v=[];el.querySelectorAll('[data-i]').forEach(n=>{const i=+n.dataset.i;if(n.classList.contains('seg')){const on=n.querySelector('button.on');v[i]=on?on.dataset.v:''}else v[i]=n.value.trim()});return v}
function gateNext(sl,el){
  const nx=$('next');
  if(sl.t==='q'){const hecho=sl.retry?S.retry[sl.id]:resultado(sl.id);if(hecho){nx.disabled=false;return}
    const q=QBY[sl.id],v=valores(el);nx.disabled=!q.in.every((sp,i)=>sp.k==='long'?true:(v[i]&&v[i].length>0));if(q.in[0].k==='long')nx.disabled=false}
  if(sl.t==='rap'){nx.disabled=false}
  if(sl.t==='lread')nx.disabled=!!timer&&!tFin;
  if(sl.t==='lq')nx.disabled=false;
  if(sl.t==='write'){const w=(S.texto.trim().match(/\S+/g)||[]).length,c=['ce qui','ce que','ce dont','plutôt que','pourvu que','tellement'].filter(o=>S.texto.toLowerCase().includes(o)).length;nx.disabled=!(w>=40&&c>=2);
    const ct=$('cont');if(ct)ct.textContent=`${w} / 40 mots · ${c} / 2 structures`}
}
function validar(sl,el){
  const q=QBY[sl.id],v=valores(el);
  if(q.in[0].k==='long'){ /* respuesta libre: se muestra el modelo y la persona se autoevalúa */
    S.vals[sl.id]=v;el.querySelector('#fbx').innerHTML=`<div class="fb ok" style="border-color:var(--oroC);background:rgba(217,189,134,.1)"><div class="t" style="color:var(--oroC)">Compare avec le modèle</div><div class="r">${q.a}</div><div class="w">${q.w}</div><div class="row"><button class="btn" data-r="ok">✓ Je l’avais</button><button class="btn" data-r="ko">À revoir</button></div></div>`;
    el.querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>cierraQ(sl,b.dataset.r==='ok',v)));$('next').disabled=true;$('hint').textContent='Elige una opción para continuar';return}
  let ok=q.in.every((sp,i)=>{const x=norm(v[i]||'');if(sp.k==='c')return v[i]===sp.ok;if(sp.re)return sp.re.test(x);return sp.ok.map(norm).includes(x)});
  cierraQ(sl,ok,v);
}
function cierraQ(sl,ok,v){
  const q=QBY[sl.id];
  if(sl.retry){S.retry[sl.id]=ok?'ok':'ko';S.vals['r'+sl.id]=v}else{S.res[sl.id]={f:ok?'ok':'ko'};S.vals[sl.id]=v}
  save();
  const el=$('stage').firstChild;const qq=el.querySelector('#qq');qq.querySelectorAll('input,textarea').forEach(n=>n.readOnly=true);qq.querySelectorAll('.seg').forEach(n=>n.classList.add('bloq'));
  el.querySelector('#fbx').innerHTML=fbHTML(q,ok,sl);
  if(!ok){qq.classList.add('shake');try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}}else{try{navigator.vibrate&&navigator.vibrate(20)}catch(e){}}
  $('next').textContent='Continuer';$('next').disabled=false;$('hint').textContent='';
  hud(sl,slides());
  setTimeout(()=>el.querySelector('.fb')&&el.querySelector('.fb').scrollIntoView({behavior:'smooth',block:'center'}),150);
}
function bindLread(el){
  const tx=el.querySelector('#tx'),ani=el.querySelector('#ani'),arc=el.querySelector('#arc'),tt=el.querySelector('#tt');
  if(S.lectOk){tx.classList.add('oculto');return}
  tFin=false;
  el.querySelector('#notas').addEventListener('input',e=>{S.notas=e.target.value;save()});
  $('next').onclick=null;
  window.__iniciaLectura=()=>{tx.classList.remove('oculto');tLeft=90;$('next').disabled=true;$('next').textContent='Lecture en cours…';el.querySelector('#lh').textContent='Lis et note l’essentiel. Le texte va disparaître.';
    const f=()=>{tt.textContent=Math.floor(tLeft/60)+':'+String(tLeft%60).padStart(2,'0');arc.style.strokeDashoffset=226*(1-tLeft/90);ani.classList.toggle('low',tLeft<=10);
      if(tLeft--<=0){clearInterval(timer);timer=null;tx.classList.add('oculto');tFin=true;S.lectOk=true;save();el.querySelector('#lh').textContent='Le texte a disparu. Passe aux questions : réponds de mémoire.';$('next').textContent='Voir les questions';$('next').disabled=false}};
    f();timer=setInterval(f,1000)};
}
function stopTimer(){if(timer){clearInterval(timer);timer=null}window.__iniciaLectura=null;tFin=false}
function bindWrite(el){
  const ta=el.querySelector('#texte');
  el.querySelectorAll('.tema').forEach(b=>b.addEventListener('click',()=>{S.tema=b.dataset.t;save();el.querySelectorAll('.tema').forEach(x=>x.classList.toggle('on',x===b))}));
  ta.addEventListener('input',()=>{S.texto=ta.value;save();const low=ta.value.toLowerCase();el.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',low.includes(c.dataset.r)));gateNext({t:'write'},el)});
  gateNext({t:'write'},el);
}
function confeti(){const c=document.createElement('div');c.className='conf';for(let i=0;i<46;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.setProperty('--t',(2.4+Math.random()*2)+'s');p.style.animationDelay=Math.random()*.8+'s';p.style.background=['#d9bd86','#8fd3b6','#6aa9e0','#e07a9a'][i%4];c.appendChild(p)}document.body.appendChild(c);setTimeout(()=>c.remove(),5200)}

/* ───────── Navegación ───────── */
async function enviar(){
  if(!sb){$('msgb').textContent='No se pudo conectar con la plataforma.';return}
  const b=$('next');b.disabled=true;$('msgb').textContent='Envoi en cours…';
  const w=(S.texto.trim().match(/\S+/g)||[]).length,low=S.texto.toLowerCase();
  const est=['ce qui','ce que','ce dont','plutôt que','pourvu que','tellement'].filter(o=>low.includes(o)).length;
  const respuestas={};Object.keys(S.res).forEach(k=>respuestas[k]=S.res[k].f);respuestas._maitrise=dominados();respuestas._revoir=Object.entries(CONC).filter(([k,c])=>c.q.some(i=>resultado(i)==='ko')).map(([k])=>k);respuestas._rattrapage=Object.keys(S.retry).filter(k=>S.retry[k]==='ok').length;
  const {error}=await sb.rpc('enviar_revision_autonoma',{p_datos:{nombre,rappel:S.rap.every(x=>x),lectura:!!S.lectOk&&S.lect.every(x=>x),quiz_resp:QUIZ_IDS.filter(i=>S.res[i]).length,quiz_pts:ptsPrimero(QUIZ_IDS),boss_pts:ptsPrimero(BOSS_IDS),palabras:w,estructuras:est,tema:S.tema,texto:S.texto,respuestas}});
  if(error){b.disabled=false;$('msgb').innerHTML='No se pudo guardar: '+esc(error.message)+'. Inténtalo de nuevo.';return}
  S.enviado=new Date().toISOString();save();S.idx++;render();
}
$('next').addEventListener('click',()=>{
  const list=slides(),sl=list[S.idx];
  if(sl.t==='q'){const hecho=sl.retry?S.retry[sl.id]:resultado(sl.id);if(!hecho){validar(sl,$('stage').firstChild);return}}
  if(sl.t==='rap'){const n=RAPPEL[sl.k].reglas.length;if(S.step<n-1){S.step++;save();render();$('stage').firstChild.scrollTop=1e5;return}S.step=0}
  if(sl.t==='lread'&&!S.lectOk&&!tFin&&window.__iniciaLectura){window.__iniciaLectura();return}
  if(sl.t==='lq'){if(!S.lect[sl.i]){S.vals['lq'+sl.i]=($('lqa')||{}).value||'';S.lect[sl.i]=1;save();render();return}}
  if(sl.t==='bonus'){S.bonus=true;save()}
  if(sl.t==='bilan'){enviar();return}
  if(sl.t==='fin'){S.idx=list.findIndex(x=>x.t==='bilan');render();return}
  S.idx++;S.step=0;save();render();
});
$('back').addEventListener('click',()=>{if(S.idx>0){S.idx--;S.step=0;atras=true;render()}});
$('stage').addEventListener('click',e=>{const b=e.target.closest('.btn');if(b&&b.dataset.r&&false){}});
addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&e.target.tagName!=='TEXTAREA'&&!$('next').disabled){e.preventDefault();$('next').click()}});

/* ───────── Arranque: sesión, nombre, avance guardado ───────── */
(async()=>{
  try{
    if(sb){const r=await sb.auth.getSession();const u=r&&r.data&&r.data.session&&r.data.session.user;if(u){uid=u.id;
      try{const p=await sb.from('profiles').select('nombre_completo').eq('id',uid).maybeSingle();nombre=((p&&p.data&&p.data.nombre_completo)||'').toLowerCase().replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toUpperCase())}catch(e){}}}
  }catch(e){}
  load();if(S.enviado&&S.idx<2)S.idx=0;render();
})();
</script>
